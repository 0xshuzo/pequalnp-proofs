name: Personal proof submission
on:
  push:
    branches: [pnp-upstream-submit]
permissions: {}
concurrency:
  group: pnp-personal-upstream
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: pnp-upstream
    steps:
      - name: Verify personal account and process the pinned proof
        env:
          PNP_PERSONAL_CREDENTIAL: ${{ secrets.PNP_UPSTREAM_TOKEN }}
        shell: python
        run: |
          """Read the project checker's accepted reduction and validate its rendered children."""
          
          from collections.abc import Iterable
          from io import BytesIO
          import json
          import re
          from zipfile import BadZipFile, ZipFile
          
          
          _STEP = "Run the reduction checker"
          _STEP_FILE = re.compile(r"[^/]+/[0-9]+_Run the reduction checker\.txt")
          _TIMESTAMP = re.compile(r"\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?Z (.*)")
          _COLOR = re.compile(r"\x1b\[[0-9;]*m")
          _INVOCATION = re.compile(
              r'if (?:taskset -c [\d,-]+ timeout -k [0-9]+ [0-9]+ )?'
              r'node tools/check-lean\.mjs "\$PROOF_FILE" "\$RUNNER_TEMP/statement/statement\.txt" '
              r'reduce; then status=0; else status=\$\?; fi'
          )
          _VERDICT = re.compile(
              r"ACCEPTED \(reduce\): ([A-Za-z0-9_.]+); axioms \[[^\r\n]*?\]; "
              r"kernel re-checked [0-9]+ constants of \[[^\r\n]*\]"
          )
          _DECIMALS = re.compile(r"«[^»]*»|\d+(?:_\d+)*")
          
          
          def _log_text(data: bytes) -> str:
              try:
                  return data.decode("utf-8-sig")
              except UnicodeDecodeError:
                  raise ValueError("Checker log contains invalid UTF-8") from None
          
          
          def _step_log(data: bytes) -> tuple[str, bool]:
              """An individual step file has provenance; a job log needs a step boundary."""
              if not data.startswith(b"PK"):
                  return _log_text(data), False
              try:
                  with ZipFile(BytesIO(data)) as archive:
                      entries = archive.infolist()
                      steps = [entry for entry in entries if _STEP_FILE.fullmatch(entry.filename)]
                      candidates = steps or [entry for entry in entries if entry.filename == "0_build.txt"]
                      if len(candidates) != 1:
                          raise ValueError("Expected one reduction checker step or one build job log")
                      return _log_text(archive.read(candidates[0])), bool(steps)
              except (BadZipFile, RuntimeError, OSError, EOFError):
                  raise ValueError("Unreadable checker log archive") from None
          
          
          def _timed_body(line: str) -> str:
              match = _TIMESTAMP.fullmatch(line.removeprefix("\ufeff"))
              if match is None:
                  raise ValueError("Missing Actions timestamp in checker log")
              return match[1]
          
          
          def _run_output(text: str, known_step: bool, module: str) -> list[str]:
              lines = text.replace("\r\n", "\n").split("\n")
              if lines and not lines[-1]:
                  lines.pop()
              if any("\t" + _STEP + "\t" in line for line in lines):
                  fields = (line.split("\t", 2) for line in lines)
                  lines = [row[2] for row in fields if len(row) == 3 and row[1] == _STEP]
                  known_step = True
              if not lines:
                  raise ValueError("Empty reduction checker log")
              messages = [_timed_body(line) for line in lines]
              if known_step and not any(line.startswith("##[group]Run ") for line in messages):
                  # A standalone Actions step can contain just its timestamped output.
                  return messages
          
              results = []
              for start, line in enumerate(messages):
                  if not line.startswith("##[group]Run "):
                      continue
                  end = start + 1
                  while end < len(messages) and not messages[end].startswith("##["):
                      end += 1
                  header = [_COLOR.sub("", item) for item in messages[start + 1:end]]
                  if not any(_INVOCATION.fullmatch(item) for item in header):
                      continue
                  if f"  MODULE: {module}" not in header:
                      continue
                  if end + 1 >= len(messages) or messages[end] != "##[endgroup]":
                      raise ValueError("Incomplete reduction checker step header")
                  marker = re.fullmatch(r"::stop-commands::([^:\s]+)", messages[end + 1])
                  if marker is None:
                      raise ValueError("Missing reduction checker output boundary")
                  stop = end + 2
                  while stop < len(messages) and messages[stop] != f"::{marker[1]}::":
                      if messages[stop].startswith("##[group]Run "):
                          break
                      stop += 1
                  if stop == len(messages) or messages[stop] != f"::{marker[1]}::":
                      raise ValueError("Incomplete reduction checker step output")
                  results.append(messages[end + 2:stop])
              if len(results) != 1:
                  raise ValueError("Expected one reduction checker invocation for the specified module")
              return results[0]
          
          
          def checked_hypotheses(log_bytes: bytes, module: str) -> list[str]:
              """Extract the complete kernel record from a fork Actions archive or timestamped log."""
              if not isinstance(log_bytes, bytes) or not isinstance(module, str):
                  raise ValueError("Expected checker log bytes and a reduction module name")
              short = module.removeprefix("PEqualNP.Outside.")
              if re.fullmatch(r"R_[A-Za-z][A-Za-z0-9_]*", short) is None:
                  raise ValueError("Invalid reduction module name")
              module = "PEqualNP.Outside." + short
              text, known_step = _step_log(log_bytes)
              messages = _run_output(text, known_step, module)
              # Every record marker in this invocation belongs to the same consecutive
              # frame. An extra CHILD before the count or after the verdict is ambiguous.
              markers = [i for i, line in enumerate(messages)
                         if re.match(r"^(?:CHILDREN|CHILD|MANIFEST|ACCEPTED|REJECTED)\b", line)]
              if not markers:
                  raise ValueError("Missing accepted reduction record")
              frame = messages[markers[0]:markers[-1] + 1]
              count = re.fullmatch(r"CHILDREN ([2-4])", frame[0])
              if count is None or len(frame) != int(count[1]) + 3 or len(markers) != len(frame):
                  raise ValueError("Incomplete or ambiguous reduction child record")
              verdict = _VERDICT.fullmatch(frame[-1])
              if verdict is None or verdict[1] != module:
                  raise ValueError("Missing accepted verdict for the specified reduction module")
              if not frame[-2].startswith("MANIFEST "):
                  raise ValueError("Missing reduction manifest")
              try:
                  manifest = json.loads(frame[-2][9:])
              except (ValueError, RecursionError):
                  raise ValueError("Malformed reduction manifest") from None
              if not (isinstance(manifest, dict) and isinstance(manifest.get("defs"), list)
                      and isinstance(manifest.get("rests_on"), list)
                      and any(isinstance(entry, dict) and entry.get("module") == module
                              for entry in manifest["rests_on"])):
                  raise ValueError("Reduction manifest does not identify the specified module")
              statements = []
              for i, line in enumerate(frame[1:-2], 1):
                  prefix = f"CHILD {i} "
                  statement = line.removeprefix(prefix)
                  if (not line.startswith(prefix) or not statement.strip() or len(statement) > 2000
                          or any(ord(char) < 32 or ord(char) == 127 for char in statement)):
                      raise ValueError(f"Missing or malformed hypothesis {i}")
                  if statement in statements:
                      raise ValueError(f"Duplicate hypothesis {i}")
                  statements.append(statement)
              return statements
          
          
          def _identifier_char(char: str) -> bool:
              return char.isalnum() or char in "_'" or ("a" + char).isidentifier()
          
          
          def validate_hypotheses(statements: Iterable[str]) -> None:
              """Raise ValueError with a one-based position and digit count for an oversized numeral."""
              if isinstance(statements, (str, bytes)) or not isinstance(statements, Iterable):
                  raise ValueError("Expected a sequence of rendered hypotheses")
              for position, term in enumerate(statements, 1):
                  if not isinstance(term, str) or not term.strip():
                      raise ValueError(f"Missing or malformed hypothesis {position}")
                  for match in _DECIMALS.finditer(term):
                      token = match[0]
                      if token.startswith("«"):
                          continue
                      first, last = match.span()
                      if first and _identifier_char(term[first - 1]):
                          continue
                      if last < len(term) and _identifier_char(term[last]):
                          continue
                      digits = len(token) - token.count("_")
                      if digits > 20:
                          raise ValueError(f"Hypothesis {position} contains a decimal numeral with {digits} digits (maximum 20)")
          
          """Run on the dedicated fork branch, without checking out PR or proof code."""
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import time
          from urllib.parse import quote, urlencode
          
          FORK = '0xshuzo/pequalnp-proofs'
          UPSTREAM = 'open-goat/pequalnp-proofs'
          UPSTREAM_ID = 1468025030
          FORK_API = 'repos/' + FORK + '/'
          UPSTREAM_API = 'repos/' + UPSTREAM + '/'
          HELD = {'L-meta-3128', 'L-meta-3055', 'L-meta-3154', 'L-meta-3186'}
          
          
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          
          
          def gh(*args, check=True):
              return subprocess.run(['gh', *args], env=gh_env, text=True, check=check,
                                    stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=90)
          
          
          def api(path):
              for delay in (0, 2, 6):
                  if delay:
                      time.sleep(delay)
                  result = gh('api', '--hostname', 'github.com', path, check=False)
                  if result.returncode == 0:
                      return json.loads(result.stdout)
                  if not re.search(r'HTTP (502|503|504)\b', result.stderr):
                      break
              raise SystemExit(result.stderr.strip() or 'GitHub API failed')
          
          
          def current_prs(c):
              branch = api(UPSTREAM_API + 'pulls?' + urlencode({
                  'state': 'all', 'per_page': 100, 'head': '0xshuzo:' + c['branch']}))
              result = api('search/issues?' + urlencode({
                  'per_page': 100, 'q': 'repo:' + UPSTREAM + ' is:pr in:title "' + c['task'] + '"'}))
              require(not result['incomplete_results'] and result['total_count'] <= 100,
                      'Task PR search incomplete')
              pattern = re.compile(r'(?<![a-z0-9])' + re.escape(c['task']) + r'(?![a-z0-9])', re.I)
              related = [p for p in result['items'] if pattern.search(p['title'])]
              indexed = {p['number'] for p in related}
              for number in c.get('desk_prs', []):
                  if number not in indexed:
                      pull = api(UPSTREAM_API + 'pulls/' + str(number))
                      require(pull['number'] == number and pull['base']['repo']['id'] == UPSTREAM_ID,
                              'Unexpected repository for desk-listed PR')
                      related.append(pull)
                      indexed.add(number)
              print('Previous PRs for task:', [(p['number'], p['state']) for p in related], flush=True)
              return branch, related
          
          
          def confirm(c, rows):
              hits = [p for p in rows if p['state'] == 'open' or p.get('merged_at')]
              hits = [p for p in hits if p['head']['sha'] == c['sha'] and
                      p['head']['ref'] == c['branch'] and p['head']['repo']['full_name'] == FORK and
                      p['base']['repo']['id'] == UPSTREAM_ID and p['base']['ref'] == 'main' and
                      p['title'] == c['task'] and p['user']['login'] == '0xshuzo']
              if len(hits) == 1:
                  print('VERIFIED_PR', c['task'], hits[0]['html_url'], c['sha'], flush=True)
                  return True
              return False
          
          
          def verify_ci(c):
              run = api(FORK_API + 'actions/runs/' + c['run'])
              require(run['head_sha'] == c['ci_sha'] and run['status'] == 'completed' and
                      run['conclusion'] == 'success', 'Fork checker run missing or changed')
              jobs = api(FORK_API + 'actions/runs/' + c['run'] + '/jobs?filter=latest&per_page=100')
              steps = {s['name'] for j in jobs['jobs'] if j['conclusion'] == 'success'
                       for s in j['steps'] if s['conclusion'] == 'success' and
                       s.get('started_at') and s.get('completed_at')}
              if c['kind'] == 'check':
                  require(run['event'] == 'pull_request' and run['path'] == '.github/workflows/advisory.yml'
                          and run['head_sha'] == c['sha'] and 'Run the checker' in steps,
                          'Advisory checker did not run successfully on proof head')
                  return
              workflow = '.github/workflows/session-reduction.yml'
              require(run['event'] == 'push' and run['path'] == workflow and
                      {'Fetch the pinned proof commit', 'Run the reduction checker'} <= steps,
                      'Reduction checker steps did not pass')
              source = api(FORK_API + 'contents/' + workflow + '?ref=' + c['ci_sha'])
              lines = base64.b64decode(source['content']).decode().splitlines()
              expected = {'PROOF_SHA: ' + c['sha'], 'BLOB_SHA: ' + c['blob'],
                          'BASE_SHA: ' + c['base'], 'PROOF_FILE: ' + c['file']}
              require(expected <= {s.strip() for s in lines}, 'Checker inputs differ from proof')
              log_request = subprocess.run(['gh','api','--hostname','github.com',FORK_API+'actions/runs/'+c['run']+'/logs'],
                                           env=gh_env,capture_output=True,timeout=60)
              require(log_request.returncode==0,'Reduction checker log unavailable')
              module = c['file'].rsplit('/',1)[1].removesuffix('.lean')
              try:
                  validate_hypotheses(checked_hypotheses(log_request.stdout,module))
              except ValueError as error:
                  raise SystemExit(f'Reduction preflight {module}: {error}') from None
          
          
          def reduction_capacity():
              """Count each registered or pending cut once, using the account's repository PRs."""
              # This endpoint lists PRs by creator directly, including newly opened PRs before search indexing.
              query = UPSTREAM_API + 'issues?creator=0xshuzo&state=all&per_page=100'
              pages = json.loads(gh('api','--hostname','github.com','--paginate','--slurp',query).stdout)
              pulls = {}
              for page in pages:
                  for issue in page:
                      if 'pull_request' not in issue:
                          continue
                      require(issue['user']['login']=='0xshuzo', 'Unexpected PR creator')
                      n = issue['number']
                      if issue['state']=='open':
                          pulls[n] = 'open'
                      else:
                          info = issue['pull_request']
                          if 'merged_at' not in info:
                              info = api(UPSTREAM_API+'pulls/'+str(n))
                          if info['merged_at']:
                              pulls[n] = 'merged'
              raw = subprocess.check_output(['curl','-fsS','--max-time','25','--max-filesize','25000000',
                                             '-H','Cache-Control: no-cache','https://data.pequalnp.com/data/desk/gaps.json'],
                                            env={'PATH':os.environ['PATH']})
              desk = json.loads(raw)
              require(desk['repo']=='https://github.com/'+UPSTREAM, 'Unexpected desk repository')
              states = {}
              for row in desk['reductions']:
                  artifact = row['artifact']
                  states.setdefault(artifact['lean_file'], {}).setdefault(artifact['content_hash'], set()).add(row['state'])
              registered, pending = {}, {}
              by_blob = {}
              for n, status in pulls.items():
                  files = api(UPSTREAM_API+'pulls/'+str(n)+'/files?per_page=100')
                  require(len(files)<100,'PR files incomplete during reduction count')
                  for f in files:
                      path, blob = f['filename'],f['sha']
                      if f['status']!='added' or not re.fullmatch(r'lean/PEqualNP/Outside/R_[a-z]+_[0-9]+_[0-9]+\.lean',path):
                          continue
                      require(re.fullmatch('[0-9a-f]{40}',blob),'Invalid reduction blob')
                      key = (path,blob)
                      recorded = set()
                      if path in states:
                          if blob not in by_blob:
                              obj = api(UPSTREAM_API+'git/blobs/'+blob)
                              require(obj['sha']==blob and obj['encoding']=='base64', 'Reduction blob unavailable')
                              content = base64.b64decode(obj['content'])
                              require(len(content)==obj['size'], 'Incomplete reduction blob')
                              by_blob[blob] = 'sha256:'+hashlib.sha256(content).hexdigest()
                          recorded = states[path].get(by_blob[blob],set())
                      if 'open' in recorded:
                          registered.setdefault(key, set()).add(n)
                      elif not recorded:
                          # A merge can precede its publication in the desk export. Keep its reservation during the gap.
                          pending.setdefault(key, set()).add(n)
              recorded_prs = sorted(n for ns in registered.values() for n in ns)
              reserved_prs = sorted(n for ns in pending.values() for n in ns)
              summary = dict(registered=len(registered), pending=len(pending), occupied=len(set(registered)|set(pending)),
                             registered_prs=recorded_prs, reserved_prs=reserved_prs, desk_updated_at=desk['updated_at'])
              print('REDUCTION_CAPACITY',json.dumps(summary),flush=True)
              return summary
          
          
          def submit(c):
              suffixes = ('-resume', '-standard') if c['kind'] == 'check' else ('-resume',)
              branches = {'pnp/' + c['task'].lower() + suffix for suffix in suffixes}
              if c['task'] == 'L-meta-2309' and c['kind'] == 'check':
                  branches = {'pnp/w1-l-meta-2309-1795524722'}
              require(c['kind'] in ('check', 'reduce') and re.fullmatch(r'L-[a-z]+-[0-9]+', c['task'])
                      and c['branch'] in branches and
                      re.fullmatch(r'[0-9a-f]{40}', c['sha']), 'Unsupported candidate')
              rows, related = current_prs(c)
              if confirm(c, rows):
                  return
              require(not rows and not any(p['state'] == 'open' and p['user']['login'] == '0xshuzo'
                                           for p in related), 'Own PR already exists')
              require(c['task'] not in HELD or not any(p['state'] == 'open' for p in related),
                      'Competing PR awaiting owner approval')
              for other in related:
                  if other['state'] == 'open':
                      files = api(UPSTREAM_API + 'pulls/' + str(other['number']) + '/files')
                      same_path = [f for f in files if f['filename'] == c['file']]
                      if c['kind']=='reduce':
                          require(not same_path, 'A reduction already uses this Lean module in an open PR')
                      for f in same_path:
                          require(f.get('sha') and f['sha'] != c['blob'],
                                  'The same proof file already exists in an open PR')
                          print('Distinct proof on the same task in PR', other['number'], flush=True)
              checked_competitors = {p['number'] for p in related if p['state'] == 'open'}
              verify_ci(c)
              main = api(UPSTREAM_API + 'commits/main')['sha']
              branch_ref = FORK_API + 'git/ref/heads/' + quote(c['branch'], safe='/')
              require(api(branch_ref)['object']['sha'] == c['sha'], 'Fork branch no longer points to checked commit')
              compare = api(UPSTREAM_API + 'compare/' + main + '...' + c['sha'])
              require(compare['base_commit']['sha'] == main, 'Comparison base differs from pinned upstream main')
              require(compare['ahead_by'] == 1 and [p['sha'] for p in compare['commits']] == [c['sha']],
                      'Upstream comparison does not contain exactly the checked commit')
              require([p['sha'] for p in compare['commits'][0]['parents']] == [c['base']],
                      'Compared commit parent differs from proof base')
              require([(f['filename'], f['status'], f['sha']) for f in compare['files']] ==
                      [(c['file'], 'added', c['blob'])], 'Upstream comparison file or blob differs')
              require(time.time() < c['until'], 'Desk and lease verification is stale')
              if c['kind']=='reduce' and reduction_capacity()['occupied']>=5:
                  print('REDUCTION_HELD',c['task'],c['sha'],flush=True)
                  raise SystemExit('All five reduction places are registered or reserved')
              rows, related = current_prs(c)
              if confirm(c, rows):
                  return
              require(not rows and not any(p['state'] == 'open' and p['user']['login'] == '0xshuzo'
                                           for p in related), 'Own source or task PR already exists')
              require(api(branch_ref)['object']['sha'] == c['sha'], 'Fork branch moved during verification')
              require({p['number'] for p in related if p['state'] == 'open'} == checked_competitors,
                      'Competition changed during verification; recheck before submitting')
              require(time.time() < c['until'], 'Lease confirmation expired')
              cmd = gh('pr', 'create', '--repo', UPSTREAM, '--base', 'main', '--head',
                       '0xshuzo:' + c['branch'], '--title', c['task'], '--body', '',
                       '--no-maintainer-edit', check=False)
              if cmd.returncode:
                  print(cmd.stderr.rstrip(), flush=True)
              if cmd.returncode == 0:
                  url = re.fullmatch(r'https://github[.]com/open-goat/pequalnp-proofs/pull/([0-9]+)',
                                     cmd.stdout.strip())
                  if url and confirm(c, [api(UPSTREAM_API + 'pulls/' + url[1])]):
                      return
              rows, _ = current_prs(c)
              if not confirm(c, rows):
                  time.sleep(4)
                  rows, _ = current_prs(c)
                  require(confirm(c, rows), 'No confirmed upstream PR for the verified head')
          
          
          def audit(numbers):
              import io
              import zipfile
              for inspect in CANDIDATE.get('inspect_steps', []):
                  step = inspect['gap']
                  require(re.fullmatch(r'L-[a-z]+-[0-9]+',step), 'Unexpected step')
                  pattern = 'lean/PEqualNP/Outside/([LR])_'+step[2:].replace('-','_')+r'(?:_[0-9]+)?\.lean'
                  _, related = current_prs({'task':step,'branch':'pnp/'+step.lower()+'-resume'})
                  inspected = set(inspect['prs']) | {p['number'] for p in related if p['state']=='open'}
                  for number in sorted(inspected):
                      files=api(UPSTREAM_API+'pulls/'+str(number)+'/files?per_page=100')
                      for f in files:
                          if not re.fullmatch(pattern,f['filename']): continue
                          added='\n'.join(s[1:] for s in f.get('patch','').splitlines() if s.startswith('+'))
                          dimensions=re.findall(r'\b(?:let|def|abbrev)\s+(?:private\s+)?([nk])\s*(?::\s*(?:Nat|ℕ))?\s*:=\s*([0-9]{1,20})\b',added)[:10]
                          print('RELATED_FILE',json.dumps({'number':number,'file':f['filename'],'sha':f['sha'],'added':f['additions'],'dimensions':dimensions}),flush=True)
              head_main = api(UPSTREAM_API+'commits/main')['sha']
              rules = api(UPSTREAM_API+'contents/.github/workflows/advisory.yml?ref='+head_main)
              body = base64.b64decode(rules['content']).decode()
              print('UPSTREAM_ADVISORY', head_main,
                    re.findall(r'--max-filesize ([0-9]+)', body), flush=True)
              merged=api('search/issues?' + urlencode({'per_page':100, 'q':'repo:' + UPSTREAM + ' is:pr is:merged author:0xshuzo'}))
              require(not merged['incomplete_results'], 'Account merge search incomplete')
              print('ACCOUNT_MERGES', json.dumps({'total': merged['total_count'], 'prs':
                    [{'number':p['number'],'title':p['title'],'closed_at':p['closed_at']} for p in merged['items'][:40]]}), flush=True)
              cached_heads = CANDIDATE.get('closed_heads', {})
              unchanged = set()
              if cached_heads:
                  snapshot = gh('pr','list','--repo',UPSTREAM,'--author','0xshuzo','--state','closed',
                                '--limit','1000','--json','number,headRefOid,updatedAt')
                  for record in json.loads(snapshot.stdout):
                      n = record['number']
                      if (cached_heads.get(str(n)) == record['headRefOid'] and
                              record['updatedAt'] < CANDIDATE['observed_before']):
                          unchanged.add(n)
                  print('AUDIT_UNCHANGED', json.dumps(sorted(unchanged)), flush=True)
              for number in numbers:
                  if number in unchanged:
                      continue
                  pr = api(UPSTREAM_API + 'pulls/' + str(number))
                  require(pr['base']['repo']['id'] == UPSTREAM_ID and pr['user']['login'] == '0xshuzo',
                          'Unexpected PR in personal verdict audit')
                  head = pr['head']['sha']
                  verdict = None
                  run_id = None
                  observed = {}
                  comments = api(UPSTREAM_API + 'issues/' + str(number) + '/comments?per_page=100')
                  reduction_updates = []
                  for comment in comments:
                      if comment.get('user', {}).get('type') != 'Bot':
                          continue
                      wording = ' '.join(comment['body'].lower().split())
                      if 'reduction' not in wording:
                          continue
                      for phrase in ('it is not recorded', 'not open to reductions',
                                     'reduction has been recorded', 'reduction is recorded',
                                     'reduction was recorded', 'children are now on the desk',
                                     'steps are now on the desk'):
                          if phrase in wording:
                              reduction_updates.append({'id': comment['id'], 'wording': phrase})
                              break
                  if reduction_updates:
                      observed['reduction_updates'] = reduction_updates
                  earlier_closure = any(comment.get('user', {}).get('type') == 'Bot' and
                                        comment['body'].lstrip().lower().startswith('closed')
                                        for comment in comments[:-1])
                  if comments and not pr.get('merged_at') and (pr['state'] == 'closed' or earlier_closure):
                      last = comments[-1]
                      observed['last_comment_id'] = last['id']
                      summary = ' '.join(last['body'].split())
                      if not re.search(r'github_pat_|gh[pousr]_|Bearer |Authorization:|://[^/\s]+@',summary,re.I):
                          observed['last_comment_summary'] = summary[:450]
                  candidate_runs=[]
                  for comment in reversed(comments):
                      body = comment['body']
                      commit = re.search(r'Checked on the base repository at commit `([0-9a-f]{10,40})`', body)
                      link = re.search(r'https://github[.]com/open-goat/pequalnp-proofs/actions/runs/(\d+)', body)
                      if not commit or not link or not head.startswith(commit[1]):
                          continue
                      candidate_runs.append((link[1],'comment'))
                  hint=CANDIDATE.get('public_runs',{}).get(str(number))
                  if hint and re.fullmatch(r'[0-9]+',hint):
                      candidate_runs.append((hint,'project_export'))
                  for candidate_run, source in candidate_runs:
                      run = api(UPSTREAM_API + 'actions/runs/' + candidate_run)
                      observed.update(source=source, candidate_run=int(candidate_run), workflow=run['path'], run_status=run['status'])
                      if '.github/workflows/authoritative.yml' not in run['path'] or run['status'] != 'completed':
                          continue
                      request = subprocess.run(['gh','api','--hostname','github.com',
                                                UPSTREAM_API+'actions/runs/'+candidate_run+'/logs'],
                                               env=gh_env,capture_output=True,timeout=60)
                      observed['log_request'] = request.returncode
                      if request.returncode:
                          continue
                      try:
                          with zipfile.ZipFile(io.BytesIO(request.stdout)) as archive:
                              relevant = [n for n in archive.namelist() if 'Print the checker' in n]
                              if not relevant:
                                  relevant=[n for n in archive.namelist() if n.count('/')==0 and n.endswith('.txt')]
                              observed['log_files']=len(relevant)
                              for name in relevant:
                                  with archive.open(name) as data:
                                      log = data.read(4000000).decode('utf-8','replace')
                                  result = re.search(r'Z VERDICT: (ACCEPTED|REJECTED|FAULT)\b', log)
                                  if result and ('head commit: '+head) in log:
                                      verdict, run_id = result[1], int(candidate_run)
                                      if verdict == 'FAULT':
                                          message = log[result.start()+2:].splitlines()[0][:480]
                                          if not re.search(r'github_pat_|gh[pousr]_|bearer|authorization|://|[?&]sig=', message, re.I):
                                              observed['fault_message'] = message
                                          stages = re.findall(r'checker stage: ([A-Za-z ]{3,70}) t=(\d+)s', log)
                                          if stages:
                                              observed['last_stage'] = list(stages[-1])
                                      break
                      except zipfile.BadZipFile:
                          observed['zip_readable']=False
                      if verdict:
                          break
                  print('PR_STATUS', json.dumps({'number':number,'sha':head,'state':pr['state'],
                        'merged':bool(pr.get('merged_at')),'merged_at':pr.get('merged_at'),
                        'verdict':verdict,'run':run_id,'comments':len(comments),'evidence':observed}),
                        flush=True)
              for gid in sorted(HELD | {'L-meta-3921', 'L-meta-4373', 'L-meta-4399', 'L-meta-4524', 'L-meta-4889', 'L-meta-4980'}):
                  _, others = current_prs({'task':gid,'branch':gid})
                  live = sorted(p['number'] for p in others if p['state']=='open' and p['user']['login']!='0xshuzo')
                  print('HELD_COMPETITION',gid,','.join(map(str,live)),flush=True)
          
          
          def closure_inventory():
              """Read all of this account's closed upstream PRs and their closure comments."""
              query = f'repo:{UPSTREAM} is:pr is:closed author:0xshuzo'
              search = api('search/issues?' + urlencode({'per_page':1, 'q':query}))
              require(not search['incomplete_results'] and search['total_count'] < 1000,
                      'Closed pull request search incomplete')
              request = gh('pr','list','--repo',UPSTREAM,'--author','0xshuzo','--state','closed',
                           '--limit','1000','--json','number,title,author,headRefOid,state,closedAt,mergedAt,files,comments')
              rows=json.loads(request.stdout)
              require(len({r['number'] for r in rows}) == len(rows) == search['total_count'],
                      'Closed upstream pull request count changed')
              for r in sorted(rows,key=lambda x:x['number']):
                  require(r['author']['login']=='0xshuzo' and r['state'] in ('CLOSED','MERGED'),
                          'Unexpected PR author or state')
                  comments=[]
                  for comment in r['comments']:
                      body=' '.join(comment['body'].split())
                      if re.search(r'github_pat_|gh[pousr]_|Bearer |Authorization:|://[^/\s]+@|[?&]sig=',body,re.I):
                          continue
                      comments.append({'author':comment['author']['login'],'url':comment['url'],'body':body[:1700]})
                  data={k:r[k] for k in ('number','title','headRefOid','state','closedAt','mergedAt')}
                  data['files']=[f['path'] for f in r['files']]
                  data['comments']=comments
                  print('CLOSED_PR',json.dumps(data),flush=True)
              print('CLOSED_TOTAL',len(rows),flush=True)
          
          
          def fork_refs_in_upstream_prs(branches_to_check=()):
              if branches_to_check:
                  require(len(branches_to_check)<=50 and len(set(branches_to_check))==len(branches_to_check) and
                          all(re.fullmatch(r'pnp/(?:verify-lemmas-[0-9a-f]{12}|check-l-[a-z]+-[0-9]+-[0-9a-f]{10})',b)
                              for b in branches_to_check), 'Invalid cleanup branch selection')
                  started=int(time.time())
                  protected=[]
                  for branch in branches_to_check:
                      path=UPSTREAM_API+'pulls?'+urlencode(dict(state='open',head='0xshuzo:'+branch,per_page=1))
                      matches=api(path)
                      require(isinstance(matches,list) and all(p['state']=='open' and p['base']['repo']['id']==UPSTREAM_ID
                              and p['head']['ref']==branch for p in matches), 'Unexpected branch-specific PR response')
                      if matches:protected.append(branch)
                  info=json.loads(gh('api','--hostname','github.com','graphql','-f',
                              'query={repository(owner:"open-goat",name:"pequalnp-proofs"){databaseId pullRequests(states:OPEN,first:1){totalCount}}}').stdout)['data']['repository']
                  require(info['databaseId']==UPSTREAM_ID,'Unexpected repository for branch inventory')
                  print('UPSTREAM_FORK_REFS',json.dumps(dict(repo=UPSTREAM,repo_id=UPSTREAM_ID,fork=FORK,
                        observed_at=started,branches=protected,coverage=list(branches_to_check),total_open=info['pullRequests']['totalCount'])),flush=True)
                  return
              query = '''query($endCursor:String) {
                repository(owner:"open-goat",name:"pequalnp-proofs") {
                  databaseId pullRequests(first:100,states:OPEN,after:$endCursor,orderBy:{field:CREATED_AT,direction:ASC}) {
                    totalCount pageInfo { hasNextPage endCursor }
                    nodes { number headRefName headRepository { nameWithOwner } }
                  }
                }
              }'''
              for _ in range(3):
                  response = gh('api','--hostname','github.com','graphql','--paginate','--slurp','-f','query='+query)
                  branches = set()
                  numbers = set()
                  totals = []
                  pages = json.loads(response.stdout)
                  require(bool(pages),'Empty cleanup PR inventory')
                  for page in pages:
                      repo = page['data']['repository']
                      require(repo['databaseId']==UPSTREAM_ID,'Unexpected cleanup inventory repository')
                      prs = repo['pullRequests']
                      totals.append(prs['totalCount'])
                      for row in prs['nodes']:
                          numbers.add(row['number'])
                          if (row['headRepository'] or {}).get('nameWithOwner')==FORK:
                              branches.add(row['headRefName'])
                  require(not prs['pageInfo']['hasNextPage'], 'Incomplete upstream branch inventory')
                  if len(numbers)==totals[-1] and len(set(totals))==1:
                      break
              else:
                  raise SystemExit('Open upstream PR inventory changed during three complete reads')
              print('UPSTREAM_FORK_REFS',json.dumps(dict(repo=UPSTREAM,repo_id=UPSTREAM_ID,fork=FORK,
                    observed_at=int(time.time()),branches=sorted(branches),total_open=len(numbers))),flush=True)
          
          
          def main():
              global gh_env
              require(os.getenv('GITHUB_REPOSITORY') == FORK and
                      os.getenv('GITHUB_REF') == 'refs/heads/pnp-upstream-submit' and
                      os.getenv('GITHUB_EVENT_NAME') == 'push', 'Unexpected workflow context')
              token = os.environ.pop('PNP_PERSONAL_CREDENTIAL', '')
              require(token, 'Environment secret PNP_UPSTREAM_TOKEN is missing')
              gh_env = os.environ.copy()
              for name in ['GH_TOKEN', 'GITHUB_TOKEN', 'GH_DEBUG', 'GH_ENTERPRISE_TOKEN']:
                  gh_env.pop(name, None)
              with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as auth:
                  gh_env.update(GH_TOKEN=token, GH_CONFIG_DIR=auth, GH_HOST='github.com',
                                GH_PROMPT_DISABLED='1', GH_NO_UPDATE_NOTIFIER='1')
                  if not CANDIDATE:
                      quotas = api('rate_limit')['resources']
                      print('PERSONAL_QUOTA', json.dumps({key:{name:quotas[key][name]
                            for name in ('limit','remaining','reset')} for key in ('core','search','graphql')}), flush=True)
                  who = gh('api', '--hostname', 'github.com', 'user', '--jq', '.login', check=False)
                  if who.returncode and 'rate limit' in who.stderr.lower():
                      raise SystemExit('GitHub API rate limit prevented the personal login check')
                  require(who.returncode == 0 and who.stdout.strip() == '0xshuzo', 'Personal login failed')
                  headers = gh('api', '--hostname', 'github.com', '-i', 'user').stdout.split('\n\n',1)[0]
                  scopes = next((v.partition(':')[2] for v in headers.splitlines()
                                 if v.lower().startswith('x-oauth-scopes:')), '')
                  require('public_repo' in {s.strip() for s in scopes.split(',')},
                          'Personal public_repo scope unconfirmed')
                  repo = api('repos/' + UPSTREAM)
                  require(repo['full_name'] == UPSTREAM and repo['id'] == UPSTREAM_ID and
                          repo['default_branch'] == 'main', 'Unexpected upstream')
                  print('PERSONAL_LOGIN_CONFIRMED 0xshuzo', flush=True)
                  if 'cleanup_refs' in CANDIDATE:
                      fork_refs_in_upstream_prs(CANDIDATE.get('cleanup_branches',[]))
                  elif 'capacity' in CANDIDATE:
                      reduction_capacity()
                  elif 'closures' in CANDIDATE:
                      closure_inventory()
                  elif 'audit' in CANDIDATE:
                      audit(CANDIDATE['audit'])
                  elif CANDIDATE:
                      submit(CANDIDATE)
          
          
