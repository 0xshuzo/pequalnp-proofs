name: Personal proof submission
on:
  push:
    branches: [pnp-upstream-submit]
permissions: {}
concurrency:
  group: pnp-personal-upstream
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: pnp-upstream
    steps:
      - name: Verify personal account and process the pinned proof
        env:
          PNP_PERSONAL_CREDENTIAL: ${{ secrets.PNP_UPSTREAM_TOKEN }}
        shell: python
        run: |
          """Read the project checker's accepted reduction and validate its rendered children."""
          
          from collections.abc import Iterable
          from io import BytesIO
          import json
          import re
          from zipfile import BadZipFile, ZipFile
          
          
          _STEP = "Run the reduction checker"
          _STEP_FILE = re.compile(r"[^/]+/[0-9]+_Run the reduction checker\.txt")
          _TIMESTAMP = re.compile(r"\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?Z (.*)")
          _COLOR = re.compile(r"\x1b\[[0-9;]*m")
          _INVOCATION = re.compile(
              r'if (?:taskset -c [\d,-]+ timeout -k [0-9]+ [0-9]+ )?'
              r'node tools/check-lean\.mjs "\$PROOF_FILE" "\$RUNNER_TEMP/statement/statement\.txt" '
              r'reduce; then status=0; else status=\$\?; fi'
          )
          _VERDICT = re.compile(
              r"ACCEPTED \(reduce\): ([A-Za-z0-9_.]+); axioms \[[^\r\n]*?\]; "
              r"kernel re-checked [0-9]+ constants of \[[^\r\n]*\]"
          )
          _DECIMALS = re.compile(r"«[^»]*»|\d+(?:_\d+)*")
          
          
          def _log_text(data: bytes) -> str:
              try:
                  return data.decode("utf-8-sig")
              except UnicodeDecodeError:
                  raise ValueError("Checker log contains invalid UTF-8") from None
          
          
          def _step_log(data: bytes) -> tuple[str, bool]:
              """An individual step file has provenance; a job log needs a step boundary."""
              if not data.startswith(b"PK"):
                  return _log_text(data), False
              try:
                  with ZipFile(BytesIO(data)) as archive:
                      entries = archive.infolist()
                      steps = [entry for entry in entries if _STEP_FILE.fullmatch(entry.filename)]
                      candidates = steps or [entry for entry in entries if entry.filename == "0_build.txt"]
                      if len(candidates) != 1:
                          raise ValueError("Expected one reduction checker step or one build job log")
                      return _log_text(archive.read(candidates[0])), bool(steps)
              except (BadZipFile, RuntimeError, OSError, EOFError):
                  raise ValueError("Unreadable checker log archive") from None
          
          
          def _timed_body(line: str) -> str:
              match = _TIMESTAMP.fullmatch(line.removeprefix("\ufeff"))
              if match is None:
                  raise ValueError("Missing Actions timestamp in checker log")
              return match[1]
          
          
          def _run_output(text: str, known_step: bool, module: str) -> list[str]:
              lines = text.replace("\r\n", "\n").split("\n")
              if lines and not lines[-1]:
                  lines.pop()
              if any("\t" + _STEP + "\t" in line for line in lines):
                  fields = (line.split("\t", 2) for line in lines)
                  lines = [row[2] for row in fields if len(row) == 3 and row[1] == _STEP]
                  known_step = True
              if not lines:
                  raise ValueError("Empty reduction checker log")
              messages = [_timed_body(line) for line in lines]
              if known_step and not any(line.startswith("##[group]Run ") for line in messages):
                  # A standalone Actions step can contain just its timestamped output.
                  return messages
          
              results = []
              for start, line in enumerate(messages):
                  if not line.startswith("##[group]Run "):
                      continue
                  end = start + 1
                  while end < len(messages) and not messages[end].startswith("##["):
                      end += 1
                  header = [_COLOR.sub("", item) for item in messages[start + 1:end]]
                  if not any(_INVOCATION.fullmatch(item) for item in header):
                      continue
                  if f"  MODULE: {module}" not in header:
                      continue
                  if end + 1 >= len(messages) or messages[end] != "##[endgroup]":
                      raise ValueError("Incomplete reduction checker step header")
                  marker = re.fullmatch(r"::stop-commands::([^:\s]+)", messages[end + 1])
                  if marker is None:
                      raise ValueError("Missing reduction checker output boundary")
                  stop = end + 2
                  while stop < len(messages) and messages[stop] != f"::{marker[1]}::":
                      if messages[stop].startswith("##[group]Run "):
                          break
                      stop += 1
                  if stop == len(messages) or messages[stop] != f"::{marker[1]}::":
                      raise ValueError("Incomplete reduction checker step output")
                  results.append(messages[end + 2:stop])
              if len(results) != 1:
                  raise ValueError("Expected one reduction checker invocation for the specified module")
              return results[0]
          
          
          def checked_hypotheses(log_bytes: bytes, module: str) -> list[str]:
              """Extract the complete kernel record from a fork Actions archive or timestamped log."""
              if not isinstance(log_bytes, bytes) or not isinstance(module, str):
                  raise ValueError("Expected checker log bytes and a reduction module name")
              short = module.removeprefix("PEqualNP.Outside.")
              if re.fullmatch(r"R_[A-Za-z][A-Za-z0-9_]*", short) is None:
                  raise ValueError("Invalid reduction module name")
              module = "PEqualNP.Outside." + short
              text, known_step = _step_log(log_bytes)
              messages = _run_output(text, known_step, module)
              # Every record marker in this invocation belongs to the same consecutive
              # frame. An extra CHILD before the count or after the verdict is ambiguous.
              markers = [i for i, line in enumerate(messages)
                         if re.match(r"^(?:CHILDREN|CHILD|MANIFEST|ACCEPTED|REJECTED)\b", line)]
              if not markers:
                  raise ValueError("Missing accepted reduction record")
              frame = messages[markers[0]:markers[-1] + 1]
              count = re.fullmatch(r"CHILDREN ([2-4])", frame[0])
              if count is None or len(frame) != int(count[1]) + 3 or len(markers) != len(frame):
                  raise ValueError("Incomplete or ambiguous reduction child record")
              verdict = _VERDICT.fullmatch(frame[-1])
              if verdict is None or verdict[1] != module:
                  raise ValueError("Missing accepted verdict for the specified reduction module")
              if not frame[-2].startswith("MANIFEST "):
                  raise ValueError("Missing reduction manifest")
              try:
                  manifest = json.loads(frame[-2][9:])
              except (ValueError, RecursionError):
                  raise ValueError("Malformed reduction manifest") from None
              if not (isinstance(manifest, dict) and isinstance(manifest.get("defs"), list)
                      and isinstance(manifest.get("rests_on"), list)
                      and any(isinstance(entry, dict) and entry.get("module") == module
                              for entry in manifest["rests_on"])):
                  raise ValueError("Reduction manifest does not identify the specified module")
              statements = []
              for i, line in enumerate(frame[1:-2], 1):
                  prefix = f"CHILD {i} "
                  statement = line.removeprefix(prefix)
                  if (not line.startswith(prefix) or not statement.strip() or len(statement) > 2000
                          or any(ord(char) < 32 or ord(char) == 127 for char in statement)):
                      raise ValueError(f"Missing or malformed hypothesis {i}")
                  if statement in statements:
                      raise ValueError(f"Duplicate hypothesis {i}")
                  statements.append(statement)
              return statements
          
          
          def _identifier_char(char: str) -> bool:
              return char.isalnum() or char in "_'" or ("a" + char).isidentifier()
          
          
          def validate_hypotheses(statements: Iterable[str]) -> None:
              """Raise ValueError with a one-based position and digit count for an oversized numeral."""
              if isinstance(statements, (str, bytes)) or not isinstance(statements, Iterable):
                  raise ValueError("Expected a sequence of rendered hypotheses")
              for position, term in enumerate(statements, 1):
                  if not isinstance(term, str) or not term.strip():
                      raise ValueError(f"Missing or malformed hypothesis {position}")
                  for match in _DECIMALS.finditer(term):
                      token = match[0]
                      if token.startswith("«"):
                          continue
                      first, last = match.span()
                      if first and _identifier_char(term[first - 1]):
                          continue
                      if last < len(term) and _identifier_char(term[last]):
                          continue
                      digits = len(token) - token.count("_")
                      if digits > 20:
                          raise ValueError(f"Hypothesis {position} contains a decimal numeral with {digits} digits (maximum 20)")
          
          """Bind a successful fork advisory to its triggering PR and verified proof base."""
          import re
          
          
          ADVISORY_CHECKOUT = 'Fetch the pull request (plain git, no stored credentials)'
          
          
          def advisory_snapshot(receipt, *, task, source, proof, base, branch, repo, get_pr):
              if (receipt.get('task') != task or receipt.get('proof') != proof or
                      receipt.get('leased_task', source) != source):
                  raise ValueError('Advisory receipt does not identify this proof generation')
              numbers = [receipt.get(key) for key in ('base_pr', 'advisory_pr')]
              if any(type(number) is not int or number < 1 for number in numbers):
                  raise ValueError('Missing fork proof or advisory PR number')
              if 'head_ref' in receipt and receipt['head_ref'] != branch:
                  raise ValueError('Recorded proof head branch changed')
              snapshots = {}
              for number in dict.fromkeys(numbers):
                  pull = get_pr(number)
                  head, target = pull['head'], pull['base']
                  if (pull['number'] != number or pull['commits'] != 1 or pull['changed_files'] != 1 or
                          any((side.get('repo') or {}).get('full_name') != repo for side in (head, target)) or
                          head['ref'] != branch or head['sha'] != proof or
                          not re.fullmatch(r'[0-9a-f]{40}', target['sha'])):
                      raise ValueError(f'Fork PR {number} differs from the proof receipt')
                  snapshots[number] = target
              primary, advisory = (snapshots[number] for number in numbers)
              if primary['sha'] != base:
                  raise ValueError('Fork proof PR base differs from the proof parent')
              if numbers[0] != numbers[1]:
                  prefix = 'pnp-advisory-' + base[:12]
                  if advisory['ref'] not in (prefix+'-desk12m', prefix+'-own-pr') or advisory['sha'] == base:
                      raise ValueError('Fork advisory PR has an unexpected fallback base')
              fields = {'base_ref':primary['ref'], 'base_sha':primary['sha'],
                        'advisory_ref':advisory['ref'], 'advisory_sha':advisory['sha']}
              for key, value in fields.items():
                  if key in receipt and receipt[key] != value:
                      raise ValueError(f'Recorded fork PR {key} changed')
              return {'task':task, 'leased_task':source, 'proof':proof,
                      'head_ref':branch, 'base_pr':numbers[0], 'advisory_pr':numbers[1], **fields}
          
          
          def verify_advisory_checkout(run, snapshot, log):
              if (run['event'] != 'pull_request' or run['path'] != '.github/workflows/advisory.yml' or
                      run['head_sha'] != snapshot['proof'] or
                      (run.get('head_branch') is not None and run['head_branch'] != snapshot['head_ref'])):
                  raise ValueError('Advisory event differs from the proof head or workflow')
              # REST pull_requests is dynamically associated and can change after the fork PR closes.
              # Use the Actions-generated environment in the named, pre-proof checkout step.
              evidence = set()
              expected = {'PR':str(snapshot['advisory_pr']), 'EXPECTED_BASE_SHA':snapshot['advisory_sha'],
                          'EXPECTED_PROOF_SHA':snapshot['proof']}
              for line in log.splitlines():
                  parts = line.split('\t', 2)
                  if len(parts) != 3 or parts[0] != 'check' or parts[1] not in (ADVISORY_CHECKOUT,'Run the checker'):
                      continue
                  field = re.fullmatch(r'\S+Z   (PR|EXPECTED_BASE_SHA|EXPECTED_PROOF_SHA): (.*)', parts[2])
                  if field:
                      key, value = field.groups()
                      if value != expected[key]:
                          raise ValueError(f'Named step {parts[1]} has a contradictory {key}')
                      if parts[1] != ADVISORY_CHECKOUT:
                          continue
                      if key in evidence:
                          raise ValueError(f'Ambiguous checkout evidence for {key}')
                      evidence.add(key)
              if 'PR' not in evidence:
                  raise ValueError('Named checkout step does not identify the recorded advisory PR')
              if snapshot['advisory_ref'].endswith('-own-pr') and evidence != expected.keys():
                  raise ValueError('Guarded advisory checkout is missing its event base or proof SHA')
          
          """Recognize the desk's exact printed negation on paired assignments."""
          import hashlib
          import json
          import re
          
          
          SIGNED_MASK = re.compile(
              r'∃ C : PEqualNP\.CircuitLowerBounds\.Circuit, PEqualNP\.MetaComplexity\.FanInTwo C ∧ '
              r'C\.size ≤ [0-9]+ ∧ PEqualNP\.Represents\.Represents \(fun u v : Fin ([0-9]+) => '
              r'\([0-9]+ : ℕ\)\.testBit \(\1 \* u\.val \+ v\.val\)\) C'
          )
          
          
          def negated_twins(first, second):
              for positive, negative in ((first, second), (second, first)):
                  if negative == '¬ (' + positive + ')':
                      return True
                  # The table printer omits the outer parentheses around this atomic application.
                  if negative == '¬ ' + positive and re.fullmatch(
                          r'PEqualNP\.Represents\.RepSizeAtMost \(fun u v : Fin [0-9]+ => '
                          r'\([0-9]+ : ℕ\)\.testBit \([0-9]+ \* u\.val \+ v\.val\)\) [0-9]+', positive):
                      return True
                  # In the CYCLE family the desk prints the relation as an explicit existential.
                  if negative == '¬ ' + positive:
                      if SIGNED_MASK.fullmatch(positive):
                          return True
                      numbers = re.fullmatch(
                          r'PEqualNP\.Represents\.RepSizeAtMost \(fun a b : Fin ([0-9]+) => '
                          r'decide \(∃ i : Fin ([0-9]+), .*\)\) ([0-9]+)', positive)
                      if numbers:
                          size, n, budget = numbers.groups()
                          middle = str(2 * int(n))
                          def block(a, b):
                              return (f'(({a}.val = i.val ∨ {a}.val = {n} + i.val) ∧ '
                                      f'({b}.val = (i.val + 1) % {n} ∨ {b}.val = {middle} + i.val))')
                          expected = (f'PEqualNP.Represents.RepSizeAtMost (fun a b : Fin {size} => '
                                      f'decide (∃ i : Fin {n}, {block("a","b")} ∨ {block("b","a")})) {budget}')
                          if positive == expected:
                              return True
              return False
          
          
          def paired_postings(first, second):
              """The signed mask printer can give its two literal complements different proof libraries."""
              a, b = first.get('statement'), second.get('statement')
              if not a or not b or not negated_twins(a, b):
                  return False
              allowlists = (first.get('imports'), second.get('imports'))
              if not all(isinstance(items, list) and all(isinstance(i, str) and i for i in items) for items in allowlists):
                  return False
              return allowlists[0] == allowlists[1] or bool(SIGNED_MASK.fullmatch(a) or SIGNED_MASK.fullmatch(b))
          
          
          def posting_signature(row):
              fields = [row[k] for k in ('statement', 'imports', 'file', 'module')]
              return hashlib.sha256(json.dumps(fields, ensure_ascii=False, separators=(',', ':')).encode()).hexdigest()
          
          
          def live_pair_matches(candidate, rows):
              source_id, target_id = candidate['leased_task'], candidate['task']
              source = [r for r in rows if r['id'] == source_id]
              target = [r for r in rows if r['id'] == target_id]
              return (source_id != target_id and len(source) == len(target) == 1 and
                      posting_signature(source[0]) == candidate['paired_source_statement'] and
                      posting_signature(target[0]) == candidate['statement'] and paired_postings(source[0], target[0]))
          
          """Run on the dedicated fork branch, without checking out PR or proof code."""
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import time
          from urllib.parse import quote, urlencode
          
          FORK = '0xshuzo/pequalnp-proofs'
          UPSTREAM = 'open-goat/pequalnp-proofs'
          UPSTREAM_ID = 1468025030
          FORK_API = 'repos/' + FORK + '/'
          UPSTREAM_API = 'repos/' + UPSTREAM + '/'
          HELD = {'L-meta-3128', 'L-meta-3055', 'L-meta-3154', 'L-meta-3186'}
          HISTORICAL_HOLDS = HELD | {'L-meta-3921', 'L-meta-4373', 'L-meta-4399', 'L-meta-4524', 'L-meta-4889', 'L-meta-4980'}
          
          
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          
          
          def gh(*args, check=True):
              return subprocess.run(['gh', *args], env=gh_env, text=True, check=check,
                                    stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=90)
          
          
          def audit_limit(message, headers=''):
              # Emit only allowlisted response metadata. Never print the full header block.
              fields = dict((k.lower(), v.strip()) for line in headers.splitlines()
                            if ':' in line for k, _, v in [line.partition(':')])
              status = headers.splitlines()[0] if headers else ''
              limited = ('rate limit' in message.lower() or 'HTTP 429' in message or
                         re.match(r'HTTP/\S+ 429\b', status) or
                         (re.match(r'HTTP/\S+ 403\b', status) and
                          (fields.get('x-ratelimit-remaining') == '0' or 'retry-after' in fields)))
              if not limited:
                  return
              retry = fields.get('retry-after', '')
              reset = fields.get('x-ratelimit-reset', '')
              times = []
              if retry.isdecimal():
                  times.append(int(time.time()) + int(retry))
              elif retry:
                  from email.utils import parsedate_to_datetime
                  try:
                      times.append(int(parsedate_to_datetime(retry).timestamp()))
                  except (TypeError, ValueError, OverflowError):
                      pass
              if fields.get('x-ratelimit-remaining') == '0' and reset.isdecimal():
                  times.append(int(reset))
              resource = fields.get('x-ratelimit-resource')
              print('AUDIT_RATE_LIMIT', json.dumps({'resource':resource if resource in
                    ('core','search','graphql') else None, 'retry_at':max(times,default=None)}), flush=True)
              raise SystemExit('GitHub API rate limit during personal audit')
          
          
          def api(path):
              for delay in (0, 2, 6):
                  if delay:
                      time.sleep(delay)
                  audited = 'audit' in globals().get('CANDIDATE', {})
                  result = gh('api', '--hostname', 'github.com', *(['--include'] if audited else []), path, check=False)
                  header, body = '', result.stdout
                  if audited and body.startswith('HTTP/'):
                      header, _, body = body.partition('\n\n')
                  if result.returncode == 0:
                      return json.loads(body)
                  if audited:
                      audit_limit(result.stderr, header)
                  if not re.search(r'HTTP (502|503|504)\b', result.stderr):
                      break
              raise SystemExit(result.stderr.strip() or 'GitHub API failed')
          
          
          def current_prs(c):
              branch = api(UPSTREAM_API + 'pulls?' + urlencode({
                  'state': 'all', 'per_page': 100, 'head': '0xshuzo:' + c['branch']}))
              result = api('search/issues?' + urlencode({
                  'per_page': 100, 'q': 'repo:' + UPSTREAM + ' is:pr in:title "' + c['task'] + '"'}))
              require(not result['incomplete_results'] and result['total_count'] <= 100,
                      'Task PR search incomplete')
              pattern = re.compile(r'(?<![a-z0-9])' + re.escape(c['task']) + r'(?![a-z0-9])', re.I)
              related = [p for p in result['items'] if pattern.search(p['title'])]
              indexed = {p['number'] for p in related}
              for number in c.get('desk_prs', []):
                  if number not in indexed:
                      pull = api(UPSTREAM_API + 'pulls/' + str(number))
                      require(pull['number'] == number and pull['base']['repo']['id'] == UPSTREAM_ID,
                              'Unexpected repository for desk-listed PR')
                      related.append(pull)
                      indexed.add(number)
              print('Previous PRs for task:', [(p['number'], p['state']) for p in related], flush=True)
              return branch, related
          
          
          def foreign_standard_prs(c, related):
              path = 'lean/PEqualNP/Outside/' + c['task'].replace('-', '_') + '.lean'
              foreign = []
              for hit in related:
                  number = hit['number']
                  p = api(UPSTREAM_API + 'pulls/' + str(number))
                  require(p['number'] == number and p['base']['repo']['id'] == UPSTREAM_ID,
                          'Unexpected repository when confirming a competing PR')
                  if p['state'] != 'open' or p['user']['login'].lower() == '0xshuzo' or p['base']['ref'] != 'main':
                      continue
                  files = api(UPSTREAM_API + 'pulls/' + str(number) + '/files?per_page=2')
                  if len(files) == 1 and files[0]['filename'] == path and files[0]['status'] == 'added':
                      foreign.append(p['number'])
              observation = {'task': c['task'], 'prs': sorted(foreign)}
              print('TABLE_COMPETITION', json.dumps(observation), flush=True)
              return foreign
          
          
          def confirm(c, rows):
              hits = [p for p in rows if p['state'] == 'open' or p.get('merged_at')]
              hits = [p for p in hits if p['head']['sha'] == c['sha'] and
                      p['head']['ref'] == c['branch'] and p['head']['repo']['full_name'] == FORK and
                      p['base']['repo']['id'] == UPSTREAM_ID and p['base']['ref'] == 'main' and
                      p['title'] == c['task'] and p['user']['login'] == '0xshuzo']
              if len(hits) == 1:
                  print('VERIFIED_PR', c['task'], hits[0]['html_url'], c['sha'], flush=True)
                  return True
              return False
          
          
          def verify_ci(c):
              run = api(FORK_API + 'actions/runs/' + c['run'])
              require(run['head_sha'] == c['ci_sha'] and run['status'] == 'completed' and
                      run['conclusion'] == 'success', 'Fork checker run missing or changed')
              jobs = api(FORK_API + 'actions/runs/' + c['run'] + '/jobs?filter=latest&per_page=100')
              steps = {s['name'] for j in jobs['jobs'] if j['conclusion'] == 'success'
                       for s in j['steps'] if s['conclusion'] == 'success' and
                       s.get('started_at') and s.get('completed_at')}
              if c['kind'] == 'check':
                  require(run['event'] == 'pull_request' and run['path'] == '.github/workflows/advisory.yml'
                          and run['head_sha'] == c['sha'] and 'Run the checker' in steps,
                          'Advisory checker did not run successfully on proof head')
                  snapshot = advisory_snapshot(c['advisory'], task=c['task'], source=c['leased_task'],
                                               proof=c['sha'], base=c['base'], branch=c['branch'], repo=FORK,
                                               get_pr=lambda n: api(FORK_API+f'pulls/{n}'))
                  log = gh('run','view',c['run'],'--repo',FORK,'--log').stdout
                  verify_advisory_checkout(run,snapshot,log)
                  return
              workflow = '.github/workflows/session-reduction.yml'
              require(run['event'] == 'push' and run['path'] == workflow and
                      {'Fetch the pinned proof commit', 'Run the reduction checker'} <= steps,
                      'Reduction checker steps did not pass')
              source = api(FORK_API + 'contents/' + workflow + '?ref=' + c['ci_sha'])
              lines = base64.b64decode(source['content']).decode().splitlines()
              expected = {'PROOF_SHA: ' + c['sha'], 'BLOB_SHA: ' + c['blob'],
                          'BASE_SHA: ' + c['base'], 'PROOF_FILE: ' + c['file']}
              require(expected <= {s.strip() for s in lines}, 'Checker inputs differ from proof')
              log_request = subprocess.run(['gh','api','--hostname','github.com',FORK_API+'actions/runs/'+c['run']+'/logs'],
                                           env=gh_env,capture_output=True,timeout=60)
              require(log_request.returncode==0,'Reduction checker log unavailable')
              module = c['file'].rsplit('/',1)[1].removesuffix('.lean')
              try:
                  validate_hypotheses(checked_hypotheses(log_request.stdout,module))
              except ValueError as error:
                  raise SystemExit(f'Reduction preflight {module}: {error}') from None
          
          
          def read_project_desk():
              raw = subprocess.check_output(['curl','-fsS','--max-time','25','--max-filesize','25000000',
                                             '-H','Cache-Control: no-cache','https://data.pequalnp.com/data/desk/gaps.json'],
                                            env={'PATH':os.environ['PATH']})
              desk = json.loads(raw)
              require(desk['repo']=='https://github.com/'+UPSTREAM, 'Unexpected desk repository')
              return desk
          
          
          def reduction_capacity():
              """Count each registered or pending cut once, using the account's repository PRs."""
              # This endpoint lists PRs by creator directly, including newly opened PRs before search indexing.
              query = UPSTREAM_API + 'issues?creator=0xshuzo&state=all&per_page=100'
              pages = json.loads(gh('api','--hostname','github.com','--paginate','--slurp',query).stdout)
              pulls = {}
              for page in pages:
                  for issue in page:
                      if 'pull_request' not in issue:
                          continue
                      require(issue['user']['login']=='0xshuzo', 'Unexpected PR creator')
                      n = issue['number']
                      if issue['state']=='open':
                          pulls[n] = 'open'
                      else:
                          info = issue['pull_request']
                          if 'merged_at' not in info:
                              info = api(UPSTREAM_API+'pulls/'+str(n))
                          if info['merged_at']:
                              pulls[n] = 'merged'
              desk = read_project_desk()
              states = {}
              for row in desk['reductions']:
                  artifact = row['artifact']
                  states.setdefault(artifact['lean_file'], {}).setdefault(artifact['content_hash'], set()).add(row['state'])
              registered, pending = {}, {}
              by_blob = {}
              for n, status in pulls.items():
                  files = api(UPSTREAM_API+'pulls/'+str(n)+'/files?per_page=100')
                  require(len(files)<100,'PR files incomplete during reduction count')
                  for f in files:
                      path, blob = f['filename'],f['sha']
                      if f['status']!='added' or not re.fullmatch(r'lean/PEqualNP/Outside/R_[a-z]+_[0-9]+_[0-9]+\.lean',path):
                          continue
                      require(re.fullmatch('[0-9a-f]{40}',blob),'Invalid reduction blob')
                      key = (path,blob)
                      recorded = set()
                      if path in states:
                          if blob not in by_blob:
                              obj = api(UPSTREAM_API+'git/blobs/'+blob)
                              require(obj['sha']==blob and obj['encoding']=='base64', 'Reduction blob unavailable')
                              content = base64.b64decode(obj['content'])
                              require(len(content)==obj['size'], 'Incomplete reduction blob')
                              by_blob[blob] = 'sha256:'+hashlib.sha256(content).hexdigest()
                          recorded = states[path].get(by_blob[blob],set())
                      if 'open' in recorded:
                          registered.setdefault(key, set()).add(n)
                      elif not recorded:
                          # A merge can precede its publication in the desk export. Keep its reservation during the gap.
                          pending.setdefault(key, set()).add(n)
              recorded_prs = sorted(n for ns in registered.values() for n in ns)
              reserved_prs = sorted(n for ns in pending.values() for n in ns)
              summary = dict(registered=len(registered), pending=len(pending), occupied=len(set(registered)|set(pending)),
                             registered_prs=recorded_prs, reserved_prs=reserved_prs, desk_updated_at=desk['updated_at'])
              print('REDUCTION_CAPACITY',json.dumps(summary),flush=True)
              return summary
          
          
          def check_competing_files(c, numbers):
              for number in sorted(numbers):
                  files = api(UPSTREAM_API + 'pulls/' + str(number) + '/files')
                  for f in files:
                      if f['filename'] != c['file']:
                          continue
                      require(c['kind'] != 'reduce', 'A reduction already uses this Lean module in an open PR')
                      require(f.get('sha') and f['sha'] != c['blob'],
                              'The same proof file already exists in an open PR')
                      print('Distinct proof on the same task in PR', number, flush=True)
          
          
          def submit(c):
              suffixes = ('-resume', '-standard') if c['kind'] == 'check' else ('-resume',)
              branches = {'pnp/' + c['task'].lower() + suffix for suffix in suffixes}
              if c['task'] == 'L-meta-2309' and c['kind'] == 'check':
                  branches = {'pnp/w1-l-meta-2309-1795524722'}
              if re.fullmatch(r'pnp/'+re.escape(c['task'].lower())+r'-g[0-9]{10}',c['branch']):
                  branches.add(c['branch'])
              require(c['kind'] in ('check', 'reduce') and re.fullmatch(r'L-[a-z]+-[0-9]+', c['task'])
                      and c['branch'] in branches and
                      re.fullmatch(r'[0-9a-f]{40}', c['sha']), 'Unsupported candidate')
              rows, related = current_prs(c)
              if confirm(c, rows):
                  return
              require(not rows and not any(p['state'] == 'open' and p['user']['login'] == '0xshuzo'
                                           for p in related), 'Own PR already exists')
              require(c['task'] not in HELD or not any(p['state'] == 'open' for p in related),
                      'Competing PR awaiting owner approval')
              checked_competitors = {p['number'] for p in related if p['state'] == 'open'}
              check_competing_files(c, checked_competitors)
              verify_ci(c)
              main = api(UPSTREAM_API + 'commits/main')['sha']
              branch_ref = FORK_API + 'git/ref/heads/' + quote(c['branch'], safe='/')
              require(api(branch_ref)['object']['sha'] == c['sha'], 'Fork branch no longer points to checked commit')
              compare = api(UPSTREAM_API + 'compare/' + main + '...' + c['sha'])
              require(compare['base_commit']['sha'] == main, 'Comparison base differs from pinned upstream main')
              require(compare['ahead_by'] == 1 and [p['sha'] for p in compare['commits']] == [c['sha']],
                      'Upstream comparison does not contain exactly the checked commit')
              require([p['sha'] for p in compare['commits'][0]['parents']] == [c['base']],
                      'Compared commit parent differs from proof base')
              require([(f['filename'], f['status'], f['sha']) for f in compare['files']] ==
                      [(c['file'], 'added', c['blob'])], 'Upstream comparison file or blob differs')
              require(time.time() < c['until'], 'Desk and lease verification is stale')
              if c['kind']=='reduce' and reduction_capacity()['occupied']>=5:
                  print('REDUCTION_HELD',c['task'],c['sha'],flush=True)
                  raise SystemExit('All five reduction places are registered or reserved')
              rows, related = current_prs(c)
              if confirm(c, rows):
                  return
              require(not rows and not any(p['state'] == 'open' and p['user']['login'] == '0xshuzo'
                                           for p in related), 'Own source or task PR already exists')
              if c.get('defer_competing_table'):
                  require(not foreign_standard_prs(c, related), 'Earlier open standard proof for this truth table')
              require(api(branch_ref)['object']['sha'] == c['sha'], 'Fork branch moved during verification')
              still_open = {p['number'] for p in related if p['state'] == 'open'}
              require(c['task'] not in HELD or not still_open, 'Competing PR awaiting owner approval')
              check_competing_files(c, still_open - checked_competitors)
              # A three-dot comparison can still show a file as added after a competing merge.
              # Check the current main tree itself immediately before creating the PR.
              completed_file = 'lean/PEqualNP/Outside/' + c['task'].replace('-', '_') + '.lean'
              for path in dict.fromkeys([completed_file, c['file']]):
                  found = gh('api', '--hostname', 'github.com', '--silent',
                             UPSTREAM_API + 'contents/' + quote(path, safe='/') + '?ref=main', check=False)
                  require(found.returncode != 0, 'Proof file already present on upstream main: ' + path)
                  require(re.search(r'HTTP 404\b', found.stderr),
                          found.stderr.strip() or 'Could not verify the current upstream file')
              if c['leased_task'] != c['task']:
                  require(live_pair_matches(c, read_project_desk()['gaps']), 'Paired desk postings changed')
              require(time.time() < c['until'], 'Lease confirmation expired')
              cmd = gh('pr', 'create', '--repo', UPSTREAM, '--base', 'main', '--head',
                       '0xshuzo:' + c['branch'], '--title', c['task'], '--body', '',
                       '--no-maintainer-edit', check=False)
              if cmd.returncode:
                  print(cmd.stderr.rstrip(), flush=True)
              if cmd.returncode == 0:
                  url = re.fullmatch(r'https://github[.]com/open-goat/pequalnp-proofs/pull/([0-9]+)',
                                     cmd.stdout.strip())
                  if url and confirm(c, [api(UPSTREAM_API + 'pulls/' + url[1])]):
                      return
              rows, _ = current_prs(c)
              if not confirm(c, rows):
                  time.sleep(4)
                  rows, _ = current_prs(c)
                  require(confirm(c, rows), 'No confirmed upstream PR for the verified head')
          
          
          # Only these fixed terms can leave an otherwise unrecognized intake-bot comment.
          FEEDBACK_TERMS = frozenset("""
              proof proved lemma gap step statement posted desk lease leased expired released reserved
              assigned claimed available unavailable active already another earlier first competing duplicate
              checker check checked advisory authoritative verdict accepted rejected refused fault failed blocked
              cannot not never pending waiting queued queue review retry resubmit submitted recorded
              merge merged closed reopened open pull request branch base head commit changed stale rebase
              conflict file files path content size limit imports missing invalid unsupported reduction
              capacity timeout permission build repository update maintainer scheduled running superseded
              time memory resource runtime process wall clock cpu heartbeat heartbeats recursion depth
              minutes seconds exceeded exceed reached ran timed out unable finish retrying rerun smaller
              split simplify complexity kernel elaboration file size bytes killed budget infrastructure
          """.split())
          
          
          def unknown_feedback_terms(body):
              # Suppress code, URLs, markup targets and credential fields before examining prose.
              prose = re.sub(r'```[\s\S]*?(?:```|$)|`[^`\n]*(?:`|$)|https?://\S+|\]\([^)]*\)',
                             ' ', body, flags=re.I)
              prose = re.sub(r'(?im)\b(?:authorization|bearer|password|secret|credential|token|api[ _-]?key)'
                             r'\b[^\n]*', ' ', prose)
              # Do not pull words out of paths, email addresses, identifiers or encoded strings.
              words = re.findall(r"(?<![\w@/#=+.%?-])[a-z]+(?![\w@/#=+%?-]|[.][\w/])", prose.lower())
              return list(dict.fromkeys(word for word in words if word in FEEDBACK_TERMS))[:20]
          
          
          def project_comment(comment, head):
              """Return only fixed project outcomes and public comment identifiers."""
              user = comment.get('user') or {}
              if user.get('type') != 'Bot' or user.get('login', '').lower() not in (
                      'pequalnp-intake[bot]', 'pequalnp-intake'):
                  return None
              if type(comment.get('id')) is not int or comment['id'] <= 0:
                  return None
              record = {'id': comment['id'], 'outcome': 'unclassified'}
              wording = ' '.join(comment['body'].lower().split())
              if re.match(r'^this (?:step|unit) was proved first by another pull request, which has been merged\b', wording):
                  record['outcome'] = 'competing_proof_merged'
                  if 'the check accepted your proof too' in wording:
                      record['also_accepted'] = True
              elif wording.startswith('closed: the checker accepted this reduction, but it is not recorded'):
                  record['outcome'] = ('reduction_capacity' if 'five open reductions at a time' in wording
                                       else 'accepted_reduction_not_recorded')
              elif wording.startswith('closed: this reduction was accepted by the checker but is not recorded'):
                  record['outcome'] = 'accepted_reduction_not_recorded'
              elif wording.startswith('closed: this step is not open to reductions'):
                  record['outcome'] = 'reductions_not_open'
              elif timeout := re.match(r'^the check of this proof ran past the time limit of ([1-9][0-9]?) minutes?\. '
                                       r'it is being run once more\b', wording):
                  record['outcome'] = 'checker_time_limit_retry'
                  record['limit_minutes'] = int(timeout[1])
              elif wording.startswith('closed by the hourly sweep'):
                  record['outcome'] = 'hourly_sweep_closed'
              elif wording.startswith('reopened: this pull request was closed by mistake'):
                  record['outcome'] = 'reopened_after_project_fault'
              else:
                  check = re.match(r'checked on the base repository at commit `([0-9a-f]{10,40})`[.]? '
                                   r'\*\*(accepted|rejected|fault|refused)\b', wording)
                  if check:
                      record['outcome'] = 'checker_comment_' + check[2]
                      record['matches_head'] = head.startswith(check[1])
                  else:
                      terms = unknown_feedback_terms(comment['body'])
                      if terms:
                          record['terms'] = terms
              return record
          
          
          def linked_checker_run(comment, head):
              body = comment['body']
              link = re.search(r'https://github[.]com/open-goat/pequalnp-proofs/actions/runs/(\d+)', body)
              if not link:
                  return None
              commit = re.search(r'Checked on the base repository at commit `([0-9a-f]{10,40})`', body)
              if commit:
                  return (link[1], 'comment') if head.startswith(commit[1]) else None
              # A project notice can omit the commit. Its link only identifies a possible run.
              # The authoritative log must name this proof head before it can set the verdict.
              if project_comment(comment, head):
                  return link[1], 'intake_comment_link'
              return None
          
          
          def audit_comment_evidence(pr, comments):
              evidence = {}
              feedback = []
              for comment in comments:
                  record = project_comment(comment, pr['head']['sha'])
                  if record:
                      feedback.append(record)
              if feedback:
                  evidence['project_feedback'] = feedback
          
              earlier_closure = any(comment.get('user', {}).get('type') == 'Bot' and
                                    comment['body'].lstrip().lower().startswith('closed')
                                    for comment in comments[:-1])
              if comments and not pr.get('merged_at') and (pr['state'] == 'closed' or earlier_closure):
                  last_id = comments[-1]['id']
                  evidence['last_comment_id'] = last_id
                  if feedback and feedback[-1]['id'] == last_id:
                      last = feedback[-1]
                      # The handoff reader recognizes these phrases. Never copy a comment body.
                      summaries = {
                          'competing_proof_merged': 'This step was proved first by another pull request.',
                          'reduction_capacity': 'The checker accepted this reduction. Five open reductions at a time.',
                          'accepted_reduction_not_recorded': 'This reduction was accepted by the checker but is not recorded.',
                          'reductions_not_open': 'This step is not open to reductions.',
                          'hourly_sweep_closed': 'Closed by the hourly sweep.',
                          'reopened_after_project_fault': 'Reopened after a project fault.',
                      }
                      summary = summaries.get(last['outcome'])
                      if summary:
                          if last.get('also_accepted'):
                              summary += ' The check accepted your proof too.'
                          evidence['last_comment_summary'] = summary
              return evidence
          
          
          def audit(numbers):
              for saved in CANDIDATE.get('deferred_tables', []):
                  step = saved['step']
                  require(re.fullmatch(r'L-[a-z]+-[0-9]+',step),'Invalid deferred task')
                  query = {'task':step,'branch':'pnp/'+step.lower()+'-resume','desk_prs':saved['prs']}
                  _, related = current_prs(query)
                  foreign_standard_prs(query, related)
              import io
              import zipfile
              for inspect in CANDIDATE.get('inspect_steps', []):
                  step = inspect['gap']
                  require(re.fullmatch(r'L-[a-z]+-[0-9]+',step), 'Unexpected step')
                  pattern = 'lean/PEqualNP/Outside/([LR])_'+step[2:].replace('-','_')+r'(?:_[0-9]+)?\.lean'
                  _, related = current_prs({'task':step,'branch':'pnp/'+step.lower()+'-resume','desk_prs':inspect['prs']})
                  inspected = {p['number']: p for p in related if p['state']=='open' or p['number'] in inspect['prs']}
                  for number, pr in sorted(inspected.items()):
                      files=api(UPSTREAM_API+'pulls/'+str(number)+'/files?per_page=100')
                      for f in files:
                          if not re.fullmatch(pattern,f['filename']): continue
                          added='\n'.join(s[1:] for s in f.get('patch','').splitlines() if s.startswith('+'))
                          dimensions=re.findall(r'\b(?:let|def|abbrev)\s+(?:private\s+)?([nk])\s*(?::\s*(?:Nat|ℕ))?\s*:=\s*([0-9]{1,20})\b',added)[:10]
                          print('RELATED_FILE',json.dumps({'number':number,'file':f['filename'],'sha':f['sha'],'added':f['additions'],
                                                           'dimensions':dimensions,'created_at':pr['created_at']}),flush=True)
              head_main = api(UPSTREAM_API+'commits/main')['sha']
              rules = api(UPSTREAM_API+'contents/.github/workflows/advisory.yml?ref='+head_main)
              body = base64.b64decode(rules['content']).decode()
              print('UPSTREAM_ADVISORY', head_main,
                    re.findall(r'--max-filesize ([0-9]+)', body), flush=True)
              merged=api('search/issues?' + urlencode({'per_page':100, 'q':'repo:' + UPSTREAM + ' is:pr is:merged author:0xshuzo'}))
              require(not merged['incomplete_results'], 'Account merge search incomplete')
              print('ACCOUNT_MERGES', json.dumps({'total': merged['total_count'], 'prs':
                    [{'number':p['number'],'title':p['title'],'closed_at':p['closed_at']} for p in merged['items'][:40]]}), flush=True)
              cached_heads = CANDIDATE.get('closed_heads', {})
              unchanged = set()
              if cached_heads:
                  snapshot = gh('pr','list','--repo',UPSTREAM,'--author','0xshuzo','--state','closed',
                                '--limit','1000','--json','number,headRefOid,updatedAt',check=False)
                  if snapshot.returncode:
                      audit_limit(snapshot.stderr)
                      raise SystemExit(snapshot.stderr.strip() or 'Closed PR snapshot failed')
                  for record in json.loads(snapshot.stdout):
                      n = record['number']
                      if (cached_heads.get(str(n)) == record['headRefOid'] and
                              record['updatedAt'] < CANDIDATE['observed_before']):
                          unchanged.add(n)
                  print('AUDIT_UNCHANGED', json.dumps(sorted(unchanged)), flush=True)
              for number in numbers:
                  if number in unchanged:
                      continue
                  pr = api(UPSTREAM_API + 'pulls/' + str(number))
                  require(pr['base']['repo']['id'] == UPSTREAM_ID and pr['user']['login'] == '0xshuzo',
                          'Unexpected PR in personal verdict audit')
                  head = pr['head']['sha']
                  verdict = None
                  run_id = None
                  observed = {}
                  comments_path = UPSTREAM_API + 'issues/' + str(number) + '/comments?per_page=100'
                  comments = api(comments_path)
                  page = 1
                  while len(comments) == page * 100:
                      page += 1
                      comments.extend(api(comments_path + '&page=' + str(page)))
                  reduction_updates = []
                  for comment in comments:
                      if comment.get('user', {}).get('type') != 'Bot':
                          continue
                      wording = ' '.join(comment['body'].lower().split())
                      if 'reduction' not in wording:
                          continue
                      for phrase in ('it is not recorded', 'not open to reductions',
                                     'reduction has been recorded', 'reduction is recorded',
                                     'reduction was recorded', 'children are now on the desk',
                                     'steps are now on the desk'):
                          if phrase in wording:
                              reduction_updates.append({'id': comment['id'], 'wording': phrase})
                              break
                  if reduction_updates:
                      observed['reduction_updates'] = reduction_updates
                  observed.update(audit_comment_evidence(pr, comments))
                  candidate_runs = [hint for comment in reversed(comments)
                                    if (hint := linked_checker_run(comment, head))]
                  hint=CANDIDATE.get('public_runs',{}).get(str(number))
                  if hint and re.fullmatch(r'[0-9]+',hint):
                      candidate_runs.append((hint,'project_export'))
                  for candidate_run, source in candidate_runs:
                      run = api(UPSTREAM_API + 'actions/runs/' + candidate_run)
                      observed.update(source=source, candidate_run=int(candidate_run), workflow=run['path'], run_status=run['status'])
                      if run['path'] != '.github/workflows/authoritative.yml' or run['status'] != 'completed':
                          continue
                      request = subprocess.run(['gh','api','--hostname','github.com',
                                                UPSTREAM_API+'actions/runs/'+candidate_run+'/logs'],
                                               env=gh_env,capture_output=True,timeout=60)
                      observed['log_request'] = request.returncode
                      if request.returncode:
                          audit_limit(request.stderr.decode('utf-8','replace'))
                          continue
                      try:
                          with zipfile.ZipFile(io.BytesIO(request.stdout)) as archive:
                              relevant = [n for n in archive.namelist() if 'Print the checker' in n]
                              if not relevant:
                                  relevant=[n for n in archive.namelist() if n.count('/')==0 and n.endswith('.txt')]
                              observed['log_files']=len(relevant)
                              for name in relevant:
                                  with archive.open(name) as data:
                                      log = data.read(4000000).decode('utf-8','replace')
                                  result = re.search(r'Z VERDICT: (ACCEPTED|REJECTED|FAULT)\b', log)
                                  if result and ('head commit: '+head) in log:
                                      verdict, run_id = result[1], int(candidate_run)
                                      if verdict == 'FAULT':
                                          message = log[result.start()+2:].splitlines()[0][:480]
                                          if not re.search(r'github_pat_|gh[pousr]_|bearer|authorization|://|[?&]sig=', message, re.I):
                                              observed['fault_message'] = message
                                          stages = re.findall(r'checker stage: ([A-Za-z ]{3,70}) t=(\d+)s', log)
                                          if stages:
                                              observed['last_stage'] = list(stages[-1])
                                      break
                      except zipfile.BadZipFile:
                          observed['zip_readable']=False
                      if verdict:
                          break
                  print('PR_STATUS', json.dumps({'number':number,'sha':head,'state':pr['state'],
                        'merged':bool(pr.get('merged_at')),'merged_at':pr.get('merged_at'),
                        'verdict':verdict,'run':run_id,'comments':len(comments),'evidence':observed}),
                        flush=True)
              selected = HISTORICAL_HOLDS if CANDIDATE.get('refresh_holds') else set(CANDIDATE.get('active_holds', ()))
              require(selected <= HISTORICAL_HOLDS, 'Unexpected historical hold')
              for gid in sorted(selected):
                  _, others = current_prs({'task':gid,'branch':gid})
                  live = sorted(p['number'] for p in others if p['state']=='open' and p['user']['login']!='0xshuzo')
                  print('HELD_COMPETITION',gid,','.join(map(str,live)),flush=True)
          
          
          def closure_inventory():
              """Read all of this account's closed upstream PRs and their closure comments."""
              query = f'repo:{UPSTREAM} is:pr is:closed author:0xshuzo'
              search = api('search/issues?' + urlencode({'per_page':1, 'q':query}))
              require(not search['incomplete_results'] and search['total_count'] < 1000,
                      'Closed pull request search incomplete')
              request = gh('pr','list','--repo',UPSTREAM,'--author','0xshuzo','--state','closed',
                           '--limit','1000','--json','number,title,author,headRefOid,state,closedAt,mergedAt,files,comments')
              rows=json.loads(request.stdout)
              require(len({r['number'] for r in rows}) == len(rows) == search['total_count'],
                      'Closed upstream pull request count changed')
              for r in sorted(rows,key=lambda x:x['number']):
                  require(r['author']['login']=='0xshuzo' and r['state'] in ('CLOSED','MERGED'),
                          'Unexpected PR author or state')
                  comments=[]
                  for comment in r['comments']:
                      body=' '.join(comment['body'].split())
                      if re.search(r'github_pat_|gh[pousr]_|Bearer |Authorization:|://[^/\s]+@|[?&]sig=',body,re.I):
                          continue
                      comments.append({'author':comment['author']['login'],'url':comment['url'],'body':body[:1700]})
                  data={k:r[k] for k in ('number','title','headRefOid','state','closedAt','mergedAt')}
                  data['files']=[f['path'] for f in r['files']]
                  data['comments']=comments
                  print('CLOSED_PR',json.dumps(data),flush=True)
              print('CLOSED_TOTAL',len(rows),flush=True)
          
          
          def filing_times(pairs):
              require(0 < len(pairs) <= 500, 'Unexpected number of proof pairs')
              fields = 'number createdAt mergedAt state author{login} files(first:2){totalCount nodes{path}}'
              for start in range(0, len(pairs), 30):
                  group = pairs[start:start+30]
                  numbers = {number for entry in group for number in (entry['our'], entry['winner'])}
                  require(all(type(n) is int and n > 0 for n in numbers), 'Invalid PR number')
                  lookups = ' '.join(f'p{n}:pullRequest(number:{n}){{{fields}}}' for n in sorted(numbers))
                  query = '{repository(owner:"open-goat",name:"pequalnp-proofs"){databaseId '+lookups+'}}'
                  repo = json.loads(gh('api','--hostname','github.com','graphql','-f','query='+query).stdout)['data']['repository']
                  require(repo['databaseId']==UPSTREAM_ID,'Unexpected upstream repository')
                  for entry in group:
                      task = entry['task']
                      require(re.fullmatch(r'L-[a-z]+-\d+', task), 'Unexpected proof step')
                      ours, winner = (repo['p'+str(entry[k])] for k in ('our','winner'))
                      require(ours['state']=='CLOSED' and ours['author']['login']=='0xshuzo' and winner['state']=='MERGED', 'Unexpected PR outcome')
                      path = 'lean/PEqualNP/Outside/'+task.replace('-','_')+'.lean'
                      for pr in (ours,winner):
                          require(pr['files']=={'totalCount':1,'nodes':[{'path':path}]}, 'Winning proof path differs')
                      print('FILING_TIMES',json.dumps({'task':task,'our':ours['number'],'winner':winner['number'],
                            'ours_opened':ours['createdAt'],'winner_opened':winner['createdAt'],'winner_merged':winner['mergedAt']}),flush=True)
          
          
          def advertised_standard_heads(repository, wanted, profile):
              """Read the public Git head refs. Only candidate OIDs and their ref names leave this function."""
              require(repository in (UPSTREAM,FORK), 'Unexpected Git advertisement repository')
              pattern = 'refs/pull/*/head' if repository == UPSTREAM else 'refs/heads/*'
              args = ['/usr/bin/git','-c','credential.helper=',
                      '-c','credential.https://github.com.helper=!/usr/bin/gh auth git-credential',
                      '-c','http.followRedirects=false','ls-remote','--refs',
                      '--exit-code','https://github.com/'+repository+'.git',pattern,'refs/heads/main']
              env = dict(PATH=os.defpath, LC_ALL='C', GIT_TERMINAL_PROMPT='0', GIT_ALLOW_PROTOCOL='https',
                         GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_GLOBAL=os.devnull, HOME=profile, GH_CONFIG_DIR=profile,
                         GH_HOST='github.com', GH_PROMPT_DISABLED='1', GH_NO_UPDATE_NOTIFIER='1')
              with tempfile.TemporaryDirectory() as cwd, tempfile.TemporaryFile() as out:
                  env['GIT_CEILING_DIRECTORIES']=os.path.dirname(cwd)
                  subprocess.run(args,cwd=cwd,env=env,stdin=subprocess.DEVNULL,stdout=out,stderr=subprocess.DEVNULL,
                                 check=True,timeout=45)
                  require(0 < out.tell() <= 24*1024*1024,'Git ref advertisement outside review bound')
                  out.seek(0)
                  return parse_standard_advertisement(repository, out, wanted)
          
          
          def parse_standard_advertisement(repository, lines, wanted):
              matches = {oid:set() for oid in wanted}
              seen = set()
              for line in lines:
                  oid, sep, name = line.rstrip(b'\n').partition(b'\t')
                  require(sep and re.fullmatch(b'[a-f0-9]{40}',oid) and name not in seen, 'Invalid or repeated Git ref')
                  seen.add(name)
                  oid = oid.decode('ascii')
                  if name == b'refs/heads/main' and repository == UPSTREAM:
                      continue
                  if repository == UPSTREAM:
                      m = re.fullmatch(rb'refs/pull/([1-9][0-9]{0,9})/head', name)
                      require(m,'Malformed upstream PR head advertisement')
                      if oid in matches:
                          matches[oid].add(int(m[1]))
                  else:
                      require(name.startswith(b'refs/heads/') and len(name)>11,'Malformed fork head advertisement')
                      if oid in matches:
                          matches[oid].add(name[11:].decode('utf-8'))
              require(b'refs/heads/main' in seen and (repository != UPSTREAM or len(seen)>1),
                      'Expected public Git head namespace unavailable')
              return matches, seen
          
          
          def standard_head_observation(wanted, profile):
              """Check exact names, every advertised same-SHA fork alias and every matching upstream PR number."""
              oids = set(wanted.values())
              numbered, upstream_refs = advertised_standard_heads(UPSTREAM,oids,profile)
              aliases, _ = advertised_standard_heads(FORK,oids,profile)
              held = set()
              names = {branch:{branch} for branch in wanted}
              numbers = {}
              for oid in oids:
                  candidates = {branch for branch,head in wanted.items() if head==oid}
                  if len(aliases[oid])+len(numbered[oid])>12:
                      # An unusually shared OID stays protected; no unbounded query fan-out.
                      held.update(candidates)
                      continue
                  for alias in aliases[oid]:
                      names.setdefault(alias,set()).update(candidates)
                  for number in numbered[oid]:
                      numbers[number] = oid
              fields = 'number state headRefName headRefOid headRepository{nameWithOwner}'
              queries = []
              names = sorted(names.items())
              for i,(name,_) in enumerate(names):
                  queries.append(f'b{i}:pullRequests(states:OPEN,headRefName:{json.dumps(name)},first:8)'
                                 '{pageInfo{hasNextPage} nodes{'+fields+'}}')
              for number in sorted(numbers):
                  queries.append(f'p{number}:pullRequest(number:{number})'+'{'+fields+'}')
              query = ('{repository(owner:"open-goat",name:"pequalnp-proofs"){databaseId defaultBranchRef{name target{oid}} '
                       'sample:pullRequests(states:OPEN,first:2,orderBy:{field:CREATED_AT,direction:ASC}){totalCount nodes{number}} '
                       +' '.join(queries)+'}}')
              answer = json.loads(gh('api','--hostname','github.com','graphql','-f','query='+query).stdout)
              require(not answer.get('errors'), 'Partial standard-base GraphQL response')
              repo = answer['data']['repository']
              main, sample = repo['defaultBranchRef'], repo['sample']
              require(repo['databaseId']==UPSTREAM_ID and main['name']=='main' and re.fullmatch('[a-f0-9]{40}',main['target']['oid']),
                      'Unexpected upstream repository or main commit')
              require(type(sample['totalCount']) is int and sample['totalCount']>=0 and
                      len(sample['nodes'])==min(2,sample['totalCount']) and all(
                      ('refs/pull/'+str(p['number'])+'/head').encode() in upstream_refs for p in sample['nodes']),
                      'Open upstream PRs missing from Git head namespace')
          
              def inspect(row):
                  require(type(row['number']) is int and row['number']>0 and isinstance(row['headRefName'],str)
                          and re.fullmatch('[a-f0-9]{40}',row['headRefOid']), 'Invalid exact upstream PR response')
                  owner = None if row['headRepository'] is None else row['headRepository']['nameWithOwner']
                  require(owner is None or isinstance(owner,str) and owner, 'Invalid upstream head repository')
                  if row['state']=='OPEN':
                      held.update(n for n,h in wanted.items() if h==row['headRefOid'])
                  return owner
          
              for i,(name,dependent) in enumerate(names):
                  page = repo['b'+str(i)]
                  more = page['pageInfo']['hasNextPage']
                  nodes = page['nodes']
                  require(type(more) is bool and len(nodes)<=8 and
                          len({p['number'] for p in nodes})==len(nodes), 'Invalid exact head-name connection')
                  if more:
                      held.update(dependent)
                  for p in nodes:
                      require(p['headRefName']==name and p['state']=='OPEN','Unexpected exact head-name filter result')
                      if inspect(p) in (None,FORK):
                          held.update(dependent)
              for number,oid in numbers.items():
                  p=repo['p'+str(number)]
                  require(p and p['number']==number and p['state'] in ('OPEN','CLOSED','MERGED'),
                          'Advertised upstream PR unavailable')
                  inspect(p)
                  if p['state']=='OPEN':
                      # Retain the advertised candidate even when GraphQL and Git momentarily see different tips.
                      held.update(n for n,h in wanted.items() if h==oid)
              return held, main['target']['oid'], sample['totalCount'], {h:(aliases[h],numbered[h]) for h in oids}
          
          
          def standard_protection(wanted):
              started=int(time.time())
              # main() has verified this account/token pair. Git receives a private profile,
              # never the process environment, a token override, or a credential in its argv.
              with tempfile.TemporaryDirectory(dir=gh_env['GH_CONFIG_DIR']) as profile:
                  hosts=os.path.join(profile,'hosts.yml')
                  with os.fdopen(os.open(hosts,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600),'w') as out:
                      # JSON is valid YAML; keep the already verified active host login for gh.
                      json.dump({'github.com':dict(user='0xshuzo',oauth_token=gh_env['GH_TOKEN'],git_protocol='https')},out)
                  previous, _, _, before = standard_head_observation(wanted,profile)
                  final, main, total, after = standard_head_observation(wanted,profile)
              held = previous | final | {n for n,h in wanted.items() if before[h]!=after[h]}
              # GitHub's owner-qualified REST filter independently confirms actual fork PR sources,
              # including other fork ref names observed at the same SHA. Never clear an unqueried alias.
              endpoints = {}
              for name, oid in wanted.items():
                  if name not in held:
                      for alias in {name} | after[oid][0]:
                          endpoints.setdefault(alias,set()).add(name)
              for i,(alias,dependents) in enumerate(sorted(endpoints.items(),key=lambda pair:(pair[0] not in wanted,pair[0]))):
                  if i>=32:
                      held.update(dependents)
                      continue
                  require(0<=time.time()-started<=300, 'Standard base observations expired')
                  path=UPSTREAM_API+'pulls?'+urlencode(dict(state='open',head='0xshuzo:'+alias,per_page=1))
                  found=api(path)
                  require(isinstance(found,list) and len(found)<=1 and all(p['state']=='open' and
                          p['base']['repo']['id']==UPSTREAM_ID and p['head']['ref']==alias and
                          (p['head']['repo'] is None or p['head']['repo']['full_name']==FORK) for p in found),
                          'Invalid owner-qualified upstream PR lookup')
                  if found:
                      held.update(dependents)
              require(0<=time.time()-started<=300, 'Standard base observations expired')
              print('UPSTREAM_FORK_REFS',json.dumps(dict(repo=UPSTREAM,repo_id=UPSTREAM_ID,fork=FORK,
                    observed_at=started,branches=sorted(held),coverage_heads=wanted,upstream_main=main,total_open=total,
                    coverage_method='public_git_heads_and_personal_pr_queries',owner_ref_queries=min(32,len(endpoints)))),flush=True)
          
          
          def fork_refs_in_upstream_prs(branches_to_check=(), standard_heads=None):
              if standard_heads is not None:
                  require(not branches_to_check and isinstance(standard_heads, dict) and 1 <= len(standard_heads) <= 12
                          and all(re.fullmatch(r'pnp-base-[a-f0-9]{12}|pnp-advisory-[a-f0-9]{12}-(?:own-pr|desk12m)', ref)
                                  and re.fullmatch('[a-f0-9]{40}', sha) for ref, sha in standard_heads.items()),
                          'Invalid standard base coverage')
                  return standard_protection(standard_heads)
              if branches_to_check:
                  require(len(branches_to_check)<=50 and len(set(branches_to_check))==len(branches_to_check) and
                          all(re.fullmatch(r'pnp/(?:verify-lemmas-[0-9a-f]{12}|check-l-[a-z]+-[0-9]+-[0-9a-f]{10})',b)
                              for b in branches_to_check), 'Invalid cleanup branch selection')
                  started=int(time.time())
                  protected=[]
                  for branch in branches_to_check:
                      path=UPSTREAM_API+'pulls?'+urlencode(dict(state='open',head='0xshuzo:'+branch,per_page=1))
                      matches=api(path)
                      require(isinstance(matches,list) and all(p['state']=='open' and p['base']['repo']['id']==UPSTREAM_ID
                              and p['head']['ref']==branch for p in matches), 'Unexpected branch-specific PR response')
                      if matches:protected.append(branch)
                  info=json.loads(gh('api','--hostname','github.com','graphql','-f',
                              'query={repository(owner:"open-goat",name:"pequalnp-proofs"){databaseId pullRequests(states:OPEN,first:1){totalCount}}}').stdout)['data']['repository']
                  require(info['databaseId']==UPSTREAM_ID,'Unexpected repository for branch inventory')
                  print('UPSTREAM_FORK_REFS',json.dumps(dict(repo=UPSTREAM,repo_id=UPSTREAM_ID,fork=FORK,
                        observed_at=started,branches=protected,coverage=list(branches_to_check),total_open=info['pullRequests']['totalCount'])),flush=True)
                  return
              query = '''query($endCursor:String) {
                repository(owner:"open-goat",name:"pequalnp-proofs") {
                  databaseId pullRequests(first:100,states:OPEN,after:$endCursor,orderBy:{field:CREATED_AT,direction:ASC}) {
                    totalCount pageInfo { hasNextPage endCursor }
                    nodes { number headRefName headRepository { nameWithOwner } }
                  }
                }
              }'''
              for _ in range(3):
                  response = gh('api','--hostname','github.com','graphql','--paginate','--slurp','-f','query='+query)
                  branches = set()
                  numbers = set()
                  totals = []
                  pages = json.loads(response.stdout)
                  require(bool(pages),'Empty cleanup PR inventory')
                  for page in pages:
                      repo = page['data']['repository']
                      require(repo['databaseId']==UPSTREAM_ID,'Unexpected cleanup inventory repository')
                      prs = repo['pullRequests']
                      totals.append(prs['totalCount'])
                      for row in prs['nodes']:
                          numbers.add(row['number'])
                          if (row['headRepository'] or {}).get('nameWithOwner')==FORK:
                              branches.add(row['headRefName'])
                  require(not prs['pageInfo']['hasNextPage'], 'Incomplete upstream branch inventory')
                  if len(numbers)==totals[-1] and len(set(totals))==1:
                      break
              else:
                  raise SystemExit('Open upstream PR inventory changed during three complete reads')
              print('UPSTREAM_FORK_REFS',json.dumps(dict(repo=UPSTREAM,repo_id=UPSTREAM_ID,fork=FORK,
                    observed_at=int(time.time()),branches=sorted(branches),total_open=len(numbers))),flush=True)
          
          
          def main():
              global gh_env
              require(os.getenv('GITHUB_REPOSITORY') == FORK and
                      os.getenv('GITHUB_REF') == 'refs/heads/pnp-upstream-submit' and
                      os.getenv('GITHUB_EVENT_NAME') == 'push', 'Unexpected workflow context')
              token = os.environ.pop('PNP_PERSONAL_CREDENTIAL', '')
              require(token, 'Environment secret PNP_UPSTREAM_TOKEN is missing')
              gh_env = os.environ.copy()
              for name in ['GH_TOKEN', 'GITHUB_TOKEN', 'GH_DEBUG', 'GH_ENTERPRISE_TOKEN']:
                  gh_env.pop(name, None)
              with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as auth:
                  gh_env.update(GH_TOKEN=token, GH_CONFIG_DIR=auth, GH_HOST='github.com',
                                GH_PROMPT_DISABLED='1', GH_NO_UPDATE_NOTIFIER='1')
                  if not CANDIDATE:
                      quotas = api('rate_limit')['resources']
                      print('PERSONAL_QUOTA', json.dumps({key:{name:quotas[key][name]
                            for name in ('limit','remaining','reset')} for key in ('core','search','graphql')}), flush=True)
                  who = gh('api', '--hostname', 'github.com', 'user', '--jq', '.login', check=False)
                  if who.returncode and 'rate limit' in who.stderr.lower():
                      raise SystemExit('GitHub API rate limit prevented the personal login check')
                  require(who.returncode == 0 and who.stdout.strip() == '0xshuzo', 'Personal login failed')
                  headers = gh('api', '--hostname', 'github.com', '-i', 'user').stdout.split('\n\n',1)[0]
                  scopes = next((v.partition(':')[2] for v in headers.splitlines()
                                 if v.lower().startswith('x-oauth-scopes:')), '')
                  require('public_repo' in {s.strip() for s in scopes.split(',')},
                          'Personal public_repo scope unconfirmed')
                  repo = api('repos/' + UPSTREAM)
                  require(repo['full_name'] == UPSTREAM and repo['id'] == UPSTREAM_ID and
                          repo['default_branch'] == 'main', 'Unexpected upstream')
                  print('PERSONAL_LOGIN_CONFIRMED 0xshuzo', flush=True)
                  if 'cleanup_refs' in CANDIDATE:
                      fork_refs_in_upstream_prs(CANDIDATE.get('cleanup_branches',[]),CANDIDATE.get('standard_heads'))
                  elif 'inspect_tables' in CANDIDATE:
                      for entry in CANDIDATE['inspect_tables']:
                          step = entry['step']
                          require(re.fullmatch(r'L-[a-z]+-[0-9]+', step), 'Unexpected truth table')
                          query = {'task':step, 'branch':'pnp/'+step.lower()+'-resume', 'desk_prs':entry['prs']}
                          _, related = current_prs(query)
                          foreign_standard_prs(query, related)
                  elif 'capacity' in CANDIDATE:
                      reduction_capacity()
                  elif 'filing_times' in CANDIDATE:
                      filing_times(CANDIDATE['filing_times'])
                  elif 'closures' in CANDIDATE:
                      closure_inventory()
                  elif 'audit' in CANDIDATE:
                      audit(CANDIDATE['audit'])
                  elif CANDIDATE:
                      submit(CANDIDATE)
          
          
