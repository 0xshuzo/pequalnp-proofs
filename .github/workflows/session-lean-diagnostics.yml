name: Lean proof diagnostics
on:
  push:
    branches:
      - pnp-construction-compiler
permissions: {}
jobs:
  build:
    name: Compile ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: L_meta_32748
            head: c4347814e1724c7a70fa393b223d91978929a5db
            base: f54b064f0ec2cf6a2cf05d6a7e38498affd055cc
    env:
      PROOF_HEAD: ${{ matrix.head }}
      BASE_HEAD: ${{ matrix.base }}
      PROOF_MODULE: ${{ matrix.module }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Fetch the exact proof commit
        run: |
          set -eu
          unset GH_TOKEN GITHUB_TOKEN
          git init -q .
          git fetch -q --depth 2 --no-tags https://github.com/0xshuzo/pequalnp-proofs.git "$PROOF_HEAD"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$PROOF_HEAD"
          test "$(git show -s --format=%P HEAD)" = "$BASE_HEAD"
          path="lean/PEqualNP/Outside/$PROOF_MODULE.lean"
          test "$(git diff --name-only "$BASE_HEAD" HEAD)" = "$path"
          test "$(git diff --diff-filter=A --name-only "$BASE_HEAD" HEAD)" = "$path"
      - name: Install the pinned project toolchain
        run: |
          set -eu
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean/lean-toolchain)"
      - name: Fetch the pinned Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Compile the proof with Lean diagnostics
        if: matrix.measure != 'yes'
        working-directory: lean
        run: |
          set -eu
          marker="lean-$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::$marker"
          if lake build "+PEqualNP.Outside.$PROOF_MODULE"; then code=0; else code=$?; fi
          echo "::$marker::"
          exit "$code"
      - name: Profile Lean proof declarations
        if: matrix.measure == 'yes'
        working-directory: lean
        run: |
          set -eu
          lake build +PEqualNP.Defs
          marker="lean-$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::$marker"
          if lake env lean -Dprofiler=true -Dprofiler.threshold=1000 -Dtrace.profiler=true -Dtrace.profiler.threshold=2000 -Dtrace.profiler.output="$RUNNER_TEMP/timings.json" "PEqualNP/Outside/$PROOF_MODULE.lean"; then code=0; else code=$?; fi
          if test -s "$RUNNER_TEMP/timings.json"; then
            python3 - "$RUNNER_TEMP/timings.json" <<'PYTHON'
          import json,sys
          with open(sys.argv[1]) as f:
              raw=json.load(f)
          events=raw if isinstance(raw,list) else raw.get('traceEvents',[])
          spans=[e for e in events if e.get('ph')=='X' and isinstance(e.get('dur'),(int,float))]
          for e in sorted(spans,key=lambda e:e['dur'],reverse=True)[:60]:
              print('PROFILE_SECONDS',round(e['dur']/1e6,3),str(e.get('name'))[:180],str(e.get('args',{}))[:400])
          PYTHON
          fi
          echo "::$marker::"
          exit "$code"
