name: Verify auxiliary Lean lemmas
on:
  push:
    branches: [pnp/verify-lemmas-dcfd1b455dba]
permissions: {}
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Fetch pinned sources
        run: |
          set -eu
          git init -q .
          git fetch -q --depth=1 --no-tags https://github.com/0xshuzo/pequalnp-proofs.git "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Lean and Mathlib
        working-directory: lean
        run: |
          set -eu
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          lake build +PEqualNP.Defs
          lake build +PEqualNP.Outside.L_meta_17415 +PEqualNP.Outside.L_meta_18546 +PEqualNP.Outside.L_meta_2225 +PEqualNP.Outside.L_meta_2235 +PEqualNP.Outside.L_meta_2237 +PEqualNP.Outside.L_meta_3289 +PEqualNP.Outside.L_meta_5775
      - name: Check PencilCircuit.lean
        if: success() || failure()
        working-directory: lean
        run: lake env lean ../diagnostics/PencilCircuit.lean
      - name: Check PlaneReadable.lean
        if: success() || failure()
        working-directory: lean
        run: lake env lean ../diagnostics/PlaneReadable.lean
      - name: Check FlagObstruction.lean
        if: success() || failure()
        working-directory: lean
        run: lake env lean ../diagnostics/FlagObstruction.lean
