name: Verify auxiliary Lean lemmas
on:
  push:
    branches: [pnp/verify-lemmas-ac00c48712a6]
permissions: {}
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Fetch pinned sources
        run: |
          set -eu
          git init -q .
          git fetch -q --depth=1 --no-tags https://github.com/0xshuzo/pequalnp-proofs.git "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Lean and Mathlib
        working-directory: lean
        run: |
          set -eu
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          lake build +PEqualNP.Defs
          lake build +PEqualNP.Outside.L_meta_1674
      - name: Check MaskPilot.lean
        if: success() || failure()
        working-directory: lean
        run: lake env lean ../diagnostics/MaskPilot.lean
      - name: Check PairPilot.lean
        if: success() || failure()
        working-directory: lean
        run: lake env lean ../diagnostics/PairPilot.lean
