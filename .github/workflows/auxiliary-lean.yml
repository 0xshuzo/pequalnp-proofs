name: Verify auxiliary Lean lemmas
on:
  push:
    branches: [pnp/verify-lemmas-7d97d348d1b2]
permissions: {}
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Fetch pinned sources
        run: |
          set -eu
          git init -q .
          git fetch -q --depth=1 --no-tags https://github.com/0xshuzo/pequalnp-proofs.git "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Lean and Mathlib
        working-directory: lean
        run: |
          set -eu
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          lake build +PEqualNP.Defs
      - name: Check Evaluator1018C.lean
        if: success() || failure()
        working-directory: lean
        run: |
          if test -x /usr/bin/time; then
            lake env /usr/bin/time -f 'LEAN_RESOURCE Evaluator1018C.lean wall_seconds=%e peak_rss_kib=%M' lean ../diagnostics/Evaluator1018C.lean
          else
            lake env lean ../diagnostics/Evaluator1018C.lean
          fi
      - name: Check Length1018B.lean
        if: success() || failure()
        working-directory: lean
        run: |
          if test -x /usr/bin/time; then
            lake env /usr/bin/time -f 'LEAN_RESOURCE Length1018B.lean wall_seconds=%e peak_rss_kib=%M' lean ../diagnostics/Length1018B.lean
          else
            lake env lean ../diagnostics/Length1018B.lean
          fi
      - name: Check RawInput1018.lean
        if: success() || failure()
        working-directory: lean
        run: |
          if test -x /usr/bin/time; then
            lake env /usr/bin/time -f 'LEAN_RESOURCE RawInput1018.lean wall_seconds=%e peak_rss_kib=%M' lean ../diagnostics/RawInput1018.lean
          else
            lake env lean ../diagnostics/RawInput1018.lean
          fi
      - name: Check FiniteTable1018.lean
        if: success() || failure()
        working-directory: lean
        run: |
          if test -x /usr/bin/time; then
            lake env /usr/bin/time -f 'LEAN_RESOURCE FiniteTable1018.lean wall_seconds=%e peak_rss_kib=%M' lean ../diagnostics/FiniteTable1018.lean
          else
            lake env lean ../diagnostics/FiniteTable1018.lean
          fi
      - name: Check Coefficients1018B.lean
        if: success() || failure()
        working-directory: lean
        run: |
          if test -x /usr/bin/time; then
            lake env /usr/bin/time -f 'LEAN_RESOURCE Coefficients1018B.lean wall_seconds=%e peak_rss_kib=%M' lean ../diagnostics/Coefficients1018B.lean
          else
            lake env lean ../diagnostics/Coefficients1018B.lean
          fi
