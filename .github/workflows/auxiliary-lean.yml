name: Verify auxiliary Lean lemmas
on:
  push:
    branches: [pnp/verify-lemmas-0b748f3c9198]
permissions: {}
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Fetch pinned sources
        run: |
          set -eu
          git init -q .
          git fetch -q --depth=1 --no-tags https://github.com/0xshuzo/pequalnp-proofs.git "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Lean and Mathlib
        working-directory: lean
        run: |
          set -eu
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          lake build +PEqualNP.Defs
          lake build +PEqualNP.Outside.L_meta_2970 +PEqualNP.Outside.L_meta_2972 +PEqualNP.Outside.L_meta_3696 +PEqualNP.Outside.L_meta_4451 +PEqualNP.Outside.L_meta_9091
      - name: Check Small29900.lean
        if: success() || failure()
        working-directory: lean
        run: lake env lean ../diagnostics/Small29900.lean
      - name: Check Order132.lean
        if: success() || failure()
        working-directory: lean
        run: lake env lean ../diagnostics/Order132.lean
      - name: Check Fraction.lean
        if: success() || failure()
        working-directory: lean
        run: lake env lean ../diagnostics/Fraction.lean
