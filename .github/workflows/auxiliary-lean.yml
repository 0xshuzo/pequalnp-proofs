name: Verify auxiliary Lean lemmas
on:
  push:
    branches: [pnp/verify-lemmas-dd40fa1801c1]
permissions: {}
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Fetch pinned sources
        run: |
          set -eu
          git init -q .
          git fetch -q --depth=1 --no-tags https://github.com/0xshuzo/pequalnp-proofs.git "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Lean and Mathlib
        working-directory: lean
        run: |
          set -eu
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          lake build +PEqualNP.Defs
          lake build +PEqualNP.Outside.L_meta_1491 +PEqualNP.Outside.L_meta_1527 +PEqualNP.Outside.L_meta_18800 +PEqualNP.Outside.L_meta_6369 +PEqualNP.Outside.L_meta_6838 +PEqualNP.Outside.L_meta_8567 +PEqualNP.Outside.L_meta_8725 +PEqualNP.Outside.L_meta_8933
      - name: Check ChargeBound.lean
        if: success() || failure()
        working-directory: lean
        run: lake env lean ../diagnostics/ChargeBound.lean
      - name: Check ExtendPlane.lean
        if: success() || failure()
        working-directory: lean
        run: lake env lean ../diagnostics/ExtendPlane.lean
