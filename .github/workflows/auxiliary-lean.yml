name: Verify auxiliary Lean lemmas
on:
  push:
    branches: [pnp/verify-lemmas-d8ae5612c57f]
permissions: {}
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Fetch pinned sources
        run: |
          set -eu
          git init -q .
          git fetch -q --depth=1 --no-tags https://github.com/0xshuzo/pequalnp-proofs.git "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Lean and Mathlib
        working-directory: lean
        run: |
          set -eu
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          lake build +PEqualNP.Defs
      - name: Check SlackLightMatched31.lean
        if: success() || failure()
        working-directory: lean
        run: |
          if test -x /usr/bin/time; then
            taskset -c 0,1 env LEAN_NUM_THREADS=3 lake env /usr/bin/time -f 'LEAN_RESOURCE SlackLightMatched31.lean wall_seconds=%e peak_rss_kib=%M' lean ../diagnostics/SlackLightMatched31.lean
          else
            taskset -c 0,1 env LEAN_NUM_THREADS=3 lake env lean ../diagnostics/SlackLightMatched31.lean
          fi
      - name: Check SharedRootGuardCostB.lean
        if: success() || failure()
        working-directory: lean
        run: |
          if test -x /usr/bin/time; then
            taskset -c 0,1 env LEAN_NUM_THREADS=3 lake env /usr/bin/time -f 'LEAN_RESOURCE SharedRootGuardCostB.lean wall_seconds=%e peak_rss_kib=%M' lean ../diagnostics/SharedRootGuardCostB.lean
          else
            taskset -c 0,1 env LEAN_NUM_THREADS=3 lake env lean ../diagnostics/SharedRootGuardCostB.lean
          fi
