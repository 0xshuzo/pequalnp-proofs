name: Verify auxiliary Lean lemmas
on:
  push:
    branches: [pnp/verify-lemmas-0146c9a0b5e6]
permissions: {}
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Fetch pinned sources
        run: |
          set -eu
          git init -q .
          git fetch -q --depth=1 --no-tags https://github.com/0xshuzo/pequalnp-proofs.git "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Lean and Mathlib
        working-directory: lean
        run: |
          set -eu
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          lake build +PEqualNP.Defs
      - name: Check FourMatchB.lean
        if: success() || failure()
        working-directory: lean
        run: |
          if test -x /usr/bin/time; then
            lake env /usr/bin/time -f 'LEAN_RESOURCE FourMatchB.lean wall_seconds=%e peak_rss_kib=%M' lean ../diagnostics/FourMatchB.lean
          else
            lake env lean ../diagnostics/FourMatchB.lean
          fi
      - name: Check PostedLayers.lean
        if: success() || failure()
        working-directory: lean
        run: |
          if test -x /usr/bin/time; then
            lake env /usr/bin/time -f 'LEAN_RESOURCE PostedLayers.lean wall_seconds=%e peak_rss_kib=%M' lean ../diagnostics/PostedLayers.lean
          else
            lake env lean ../diagnostics/PostedLayers.lean
          fi
      - name: Check PhysicalExceptionalB.lean
        if: success() || failure()
        working-directory: lean
        run: |
          if test -x /usr/bin/time; then
            lake env /usr/bin/time -f 'LEAN_RESOURCE PhysicalExceptionalB.lean wall_seconds=%e peak_rss_kib=%M' lean ../diagnostics/PhysicalExceptionalB.lean
          else
            lake env lean ../diagnostics/PhysicalExceptionalB.lean
          fi
